name: Integrated balance approval evidence

on:
  push:
    branches: [ccr-balance-port]
    paths: ['.github/workflows/ex-integrated-precheck.yml']

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix:
        profile: [Free, Ads, Pass, Spend30, Spend100, PassVisible]
        first_seed: [1, 7, 13, 19, 25]
        group: [effect, purchase]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run same-seed shard
        env:
          PROFILE: ${{ matrix.profile }}
          FIRST_SEED: ${{ matrix.first_seed }}
          GROUP: ${{ matrix.group }}
        run: |
          if [ "$GROUP" = effect ]; then
            cases=none,full,one_set,offline_cap
          else
            cases=one,spread_three,two_sets,staged
          fi
          run_shard() {
            python3 tools/economy-sim/ex-precheck.py build/integrated \
              --integrated --jobs "$1" --seeds 6 --first-seed "$FIRST_SEED" \
              --profiles "$PROFILE" --cases "$cases"
          }
          if ! run_shard "$(nproc)" > "$RUNNER_TEMP/integrated.log" 2>&1; then
            tail -35 "$RUNNER_TEMP/integrated.log"
            if ! run_shard 2 > "$RUNNER_TEMP/integrated.log" 2>&1; then
              tail -45 "$RUNNER_TEMP/integrated.log"
              last_error=$(grep -E 'Caused by:|Exception|Error:|^> ' "$RUNNER_TEMP/integrated.log" | tail -5 || true)
              printf '::error title=Integrated shard failed::%s\n' "${last_error//$'\n'/%0A}"
              exit 1
            fi
          fi
          tail -8 "$RUNNER_TEMP/integrated.log"
      - uses: actions/upload-artifact@v4
        with:
          name: ex-integrated-${{ matrix.profile }}-${{ matrix.first_seed }}-${{ matrix.group }}
          path: |
            build/integrated/*.csv
            build/integrated/manifest.json
          if-no-files-found: error

  publish-evidence:
    needs: shard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ex-integrated-*
          path: build/integrated-shards
      - name: Merge and verify all 1440 cases
        run: python3 tools/economy-sim/precheck/merge-shards.py build/integrated-shards docs/balance/ex-integrated-data
      - uses: actions/upload-artifact@v4
        with:
          name: ex-integrated-merged
          path: docs/balance/ex-integrated-data/
      - name: Save verification data to the balance branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/balance/ex-integrated-data
          git commit -m '통합 밸런스 30시드 원자료와 해시 기록'
          git fetch origin ccr-balance-port
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/ccr-balance-port
