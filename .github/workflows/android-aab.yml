name: Android AAB (Play)

# Play 스토어용 App Bundle: 업로드 키(keystore/upload.jks.gpg, ANDROID_UPLOAD_PASSPHRASE)로 서명.
# 직접 실행할 때만. track 을 고르면 서비스 계정(FIREBASE_SERVICE_ACCOUNT, Play Console 앱 권한)으로 그 트랙에 올린다.
# Play 정책: 첫 AAB 는 Play Console 에서 손으로 한 번 올려야 API 업로드가 열린다 → 첫 실행은 track=none 으로 받아서 직접 업로드.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "versionName (예: 1.0.0)"
        default: "1.0.0"
      track:
        description: "올릴 트랙 (none = 파일만 만들기)"
        type: choice
        options: [none, internal, alpha, beta, production]
        default: none
      status:
        description: "Play 출시 상태 (completed = 바로 출시(검토 후), draft = 콘솔에서 직접 출시)"
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::GOOGLE_SERVICES_JSON 시크릿이 없어요"; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Unlock the upload key
        env:
          P: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
        run: |
          if [ -z "$P" ] || [ ! -f keystore/upload.jks.gpg ]; then echo "::error::업로드 키가 없어요 (ANDROID_UPLOAD_PASSPHRASE + android-signing-key.yml)"; exit 1; fi
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 -d -o "$RUNNER_TEMP/upload.jks" keystore/upload.jks.gpg 3<<<"$P"
          { echo "ANDROID_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks"; echo "ANDROID_UPLOAD_KEY_ALIAS=upload"; } >> "$GITHUB_ENV"
      - name: Build release bundle
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
          DND_VERSION_NAME: ${{ inputs.version }}
          DND_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_REWARDED_ID" ]; then echo "::warning::ADMOB_APP_ID / ADMOB_REWARDED_ID 시크릿이 없어 테스트 광고 ID로 빌드해요 (출시용으로는 쓰지 마세요)"; fi
          ./gradlew -p core test
          ./gradlew :app:bundleRelease
      - name: Check it is signed with the upload key
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs "$aab" | grep -q "CN=Do Not Disturb upload" || { echo "::error::업로드 키로 서명되지 않았어요"; exit 1; }
          mkdir -p out && cp "$aab" "out/DoNotDisturb-${{ inputs.version }}-${{ github.run_number }}.aab"
      - name: Forget the unlocked key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" app/google-services.json
      - uses: actions/upload-artifact@v4
        with:
          name: DoNotDisturb-aab
          path: |
            out/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload to Google Play
        if: inputs.track != 'none'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          packageName: io.github.graviton94.donotdisturb
          releaseFiles: out/*.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: distribution/whatsnew
