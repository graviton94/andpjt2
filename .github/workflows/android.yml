name: Android test build

on:
  push:
    branches: [main, 'ccr-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Core rules tests
        run: |
          if ./gradlew -p core test --no-daemon > "$RUNNER_TEMP/core-test.log" 2>&1; then
            cat "$RUNNER_TEMP/core-test.log"
          else
            cat "$RUNNER_TEMP/core-test.log"
            reason=$(tail -n 20 "$RUNNER_TEMP/core-test.log" | tr '\r\n' ' ' | cut -c 1-1400)
            echo "::error title=Core rules tests::${reason:-Gradle returned no test output}"
            exit 1
          fi
      - name: Test and assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: notification-cleaner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  smoke:
    needs: debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: notification-cleaner-debug
          path: build/apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare the balance smoke test
        run: |
          npm install --prefix build/smoke-tools --no-save --no-package-lock playwright-core@1.62.1
          ./gradlew -p core run --args="android-balance-fixture ${{ github.workspace }}/build/balance-fixture.json"
      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-linux-hw-accel: auto
          disable-animations: false
          script: SMOKE_PLAYWRIGHT="$PWD/build/smoke-tools/node_modules/playwright-core" python3 scripts/android-smoke.py build/apk/app-debug.apk build/balance-fixture.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-screens
          path: build/smoke/
          if-no-files-found: ignore
