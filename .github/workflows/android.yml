name: Android test build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test and assemble
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: notification-cleaner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  smoke:
    needs: debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: notification-cleaner-debug
          path: build/apk
      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-linux-hw-accel: auto
          script: python3 scripts/android-smoke.py build/apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-screens
          path: build/smoke/
          if-no-files-found: ignore
