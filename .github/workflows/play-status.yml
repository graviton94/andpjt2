name: Play status

# Read-only: lists every track's releases and the products on Google Play.
on:
  push:
    paths:
      - 'tools/play/status.py'
      - '.github/workflows/play-status.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Service account
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - run: pip install -q google-api-python-client google-auth
      - run: python3 tools/play/status.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
