<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공장 초기화</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#3867F0}a:hover{color:#2449B8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; font-family: 'Noto Sans KR', sans-serif; color: #16181D; background: linear-gradient(180deg, #E3ECFF 0%, #EEF1F7 100%)">
  <div style="position: absolute; inset: 0; background: #0A0F1E66" aria-hidden="true"></div>
  <section aria-label="공장 초기화" style="position: absolute; left: 0; right: 0; top: 72px; bottom: 0; border-radius: 32px 32px 0 0; background: #F7F9FC; box-shadow: 0 -12px 32px #1E2A5033; padding: 10px 16px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <span style="align-self: center; width: 44px; height: 5px; border-radius: 999px; background: #C7CDD8" aria-hidden="true"></span>
    <h1 style="margin: 0; font-size: 17px; font-weight: 700">공장 초기화</h1>

    <div style="padding: 18px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E6EAF2; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center">
      <span style="font-size: 12.5px; font-weight: 600; color: #5F6674">지금 초기화하면 받는 백업파일</span>
      <span style="font-size: 44px; line-height: 48px; font-weight: 700; color: #3867F0; letter-spacing: -0.03em">+148</span>
      <span style="font-size: 12.5px; color: #3C4250">기록을 넘긴 만큼만 받아요 · 평생 1,276 → 1,424</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6EAF2; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11.5px; color: #5F6674; font-weight: 600">모든 알림 가치</span>
        <span style="font-size: 22px; font-weight: 700; color: #0E7A3E">+9%</span>
      </div>
      <div style="padding: 12px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E6EAF2; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11.5px; color: #5F6674; font-weight: 600">이번 회차 Lv 42까지</span>
        <span style="font-size: 22px; font-weight: 700; color: #0E7A3E">5.1시간 → 4.3시간</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700"><span>초기화되는 것</span><span style="color: #5F6674">남는 것</span></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-size: 12px">
        <span style="padding: 10px; border-radius: 14px; background: #FFF1F1; color: #9F1D1D; font-weight: 600">레벨 · P · 보유 앱 · 강화 · 카드 · 판 강화</span>
        <span style="padding: 10px; border-radius: 14px; background: #EAF7EF; color: #0E7A3E; font-weight: 600">백업파일 · 백업 상점 · 앱 해금 · GB · 과금</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <strong style="font-size: 14px">백업 상점 미리보기</strong>
      <sc-for list="{{shop}}" as="b" hint-placeholder-count="3">
        <div style="height: 52px; padding: 0 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E6EAF2; display: flex; align-items: center; gap: 10px">
          <span style="flex: 1; font-size: 13px; font-weight: 600">{{b.name}}</span>
          <span style="font-size: 12px; color: #5F6674">{{b.lv}}</span>
          <span style="min-width: 64px; height: 34px; border-radius: 999px; background: #3867F02E; color: #2449B8; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{b.price}}</span>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: auto; display: flex; gap: 8px">
      <button type="button" style="flex: 1; height: 52px; border: 0; border-radius: 999px; background: #1E2A5014; color: #16181D; font: inherit; font-size: 15px; font-weight: 700">나중에</button>
      <button type="button" style="flex: 2; height: 52px; border: 0; border-radius: 999px; background: #3867F0; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">초기화하고 +148 받기</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      shop: [
        { name: '알림 가치 ×1.25', lv: '12/50', price: '41개' },
        { name: '빠른 부팅 · 레벨 기준 P −10%', lv: '6/20', price: '23개' },
        { name: '연쇄 증폭 +0.1', lv: '3/10', price: '47개' },
      ],
    };
  }
}
</script>
</body>
</html>
