<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알림 청소부 타격감 시연</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* VOICE: 게임 쇼케이스 — 짧고 신나는 말, 숫자가 주인공
   IDEA: 칩 × 배율이 한 박자씩 쌓였다가 한 방에 지갑으로 꽂힌다 (적립 → 정산)
   PICTURE: 휴대폰 한 대 크기의 살아 있는 판 (캔버스)
   COLOUR and TYPE: 어두운 판 + 파랑 칩 · 빨강 배율 상자, Black Han Sans 숫자에 단단한 잉크 외곽선과 그림자
   LAYOUT: 판 왼쪽 크게, 조작은 오른쪽 한 열 (760px 아래는 판 → 조작) */
:root{color-scheme:light dark;--bg:light-dark(#EEF1F7,#100D0A);--ink:light-dark(#16181D,#F6F1EA);--sub:light-dark(#4B5160,#B3A89B);--card:light-dark(#FFFFFF,#201B16);--line:light-dark(#DDE2EC,#3A332C);--acc:light-dark(#3867F0,#EFA03F);--onacc:light-dark(#FFFFFF,#1E1408)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3vw,40px) max(4vw,16px);max-width:1180px;margin:0 auto}
h1{margin:0 0 6px;font-size:clamp(28px,4vw,40px);line-height:1.08;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
.lead{margin:0 0 20px;color:var(--sub);max-width:62ch}
.wrap{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}
.phone{position:relative;width:100%;max-width:420px;aspect-ratio:390/740;border-radius:40px;padding:10px;background:#0B0907;box-shadow:0 30px 60px #0007, inset 0 0 0 2px #2b241d}
.phone canvas{width:100%;height:100%;display:block;border-radius:32px;touch-action:manipulation;cursor:pointer}
.panel{display:flex;flex-direction:column;gap:18px}
.group{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.group h2{margin:0 0 10px;font-size:15px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:700;font-size:14px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button[aria-pressed=true],button.primary{background:var(--acc);color:var(--onacc);border-color:transparent}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.on td{color:var(--acc);font-weight:700}
.note{font-size:13px;color:var(--sub);margin:8px 0 0}
@media(max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}.phone{margin:0 auto}}
</style>
</head>
<body>
<main class="band">
  <h1>탭하면 터진다: 알림 청소부 타격감 시연</h1>
  <p class="lead">알림을 탭하면 연쇄가 위로 번집니다. 터질 때마다 파란 <b>칩</b>에 점수가, 빨간 <b>배율</b>에 연쇄 번호가 한 박자씩 쌓이고, 연쇄가 끝나면 둘이 곱해져 한 방에 지갑으로 꽂힙니다. 소리를 켜고 들어 보세요.</p>
  <div class="wrap">
    <div class="phone"><canvas id="stage" aria-label="알림 판. 탭하면 연쇄 폭발" role="img"></canvas></div>
    <div class="panel">
      <section class="group">
        <h2>연쇄 길이</h2>
        <div class="row" id="chains"></div>
        <p class="note">판의 아무 알림이나 탭하세요. 단위가 바뀌는 순간(억 → 조)을 노려 보세요.</p>
      </section>
      <section class="group">
        <h2>특수 연출</h2>
        <div class="row">
          <button type="button" id="wave" class="primary">과부하 파동 ×3³</button>
          <button type="button" id="cap">과열 보호</button>
          <button type="button" id="auto" aria-pressed="false">자동 시연</button>
        </div>
      </section>
      <section class="group">
        <h2>설정</h2>
        <div class="row">
          <button type="button" id="sound" aria-pressed="true">소리</button>
          <button type="button" id="reduce" aria-pressed="false">움직임 줄이기</button>
          <button type="button" id="daylight" aria-pressed="false">판 데이라이트</button>
        </div>
      </section>
      <section class="group">
        <h2>확대의 사다리 (토큰 fx.ladder)</h2>
        <table><thead><tr><th>연쇄</th><th>이름</th><th class="n">멈춤</th><th class="n">흔들림</th><th class="n">파편</th></tr></thead><tbody id="ladder"></tbody></table>
        <p class="note">화면 전체는 흔들지 않고 판과 점수판만 흔듭니다. 번쩍임은 9연쇄 이상에서 초당 3회 이하.</p>
      </section>
    </div>
  </div>
</main>
<script>
{
const APPS = __APPS__;
const LADDER = [
  { from: 1, to: 1, name: '팡', stop: 28, shake: 1.5, shreds: 12 },
  { from: 2, to: 3, name: '연쇄', stop: 36, shake: 2.0, shreds: 20 },
  { from: 4, to: 5, name: '폭주', stop: 48, shake: 2.5, shreds: 32 },
  { from: 6, to: 8, name: '대폭주', stop: 60, shake: 3.0, shreds: 48 },
  { from: 9, to: 99, name: '알림 해일', stop: 80, shake: 3.0, shreds: 64 },
];
const W = 390, H = 740, SIM = 1 / 120, POOL = 700;
const FD = '"Black Han Sans","Noto Sans KR",sans-serif', FB = '"Noto Sans KR",sans-serif';
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
const icons = APPS.map(a => { const i = new Image(); i.src = a.icon; return i; });
let dpr = 1;
const fit = () => { dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = W * dpr; cv.height = H * dpr; };
fit(); window.addEventListener('resize', fit);
if (document.fonts) { document.fonts.load('40px "Black Han Sans"'); document.fonts.load('700 14px "Noto Sans KR"'); }

let chainLen = 5, sound = true, reduce = false, day = false, autoOn = false;
let seed = 11;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const backOut = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const tier = n => LADDER.find(l => n >= l.from && n <= l.to);

// springs: bouncy scale and offsets
const spring = (v = 1) => ({ x: v, v: 0, t: v });
const kick = (s, a) => { s.v += a; };
const stepSpring = (s, dt, k = 340, d = 13) => { s.v += (-k * (s.x - s.t) - d * s.v) * dt; s.x += s.v * dt; };

// colour
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixc = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const ramp = h => { const c = hex(h); return [mixc(c, [0, 0, 0], .45), c, mixc(c, [255, 255, 255], .35), mixc(c, [255, 255, 255], .7), [255, 255, 255]]; };

// Korean big-number format, no trailing .0
const UNITS = [[1e20, '해'], [1e16, '경'], [1e12, '조'], [1e8, '억'], [1e4, '만']];
const split = n => {
  for (const [v, u] of UNITS) if (n >= v) { const x = n / v; return { num: x >= 1000 ? Math.round(x).toLocaleString('ko-KR') : x >= 100 ? String(Math.round(x)) : String(Math.round(x * 10) / 10), unit: u }; }
  return { num: Math.round(n).toLocaleString('ko-KR'), unit: '' };
};
const fmt = n => { const s = split(n); return s.num + s.unit; };
const fmtMult = m => m >= 100 ? Math.round(m).toLocaleString('ko-KR') : String(Math.round(m * 10) / 10);
const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v)) - 1); return Math.round(v / p) * p; };

// ---------- sound: layered synth through compressor + short echo ----------
const A = {};
function ac() {
  if (!sound) return null;
  try {
    if (!A.c) {
      const c = new (window.AudioContext || window.webkitAudioContext)();
      const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 5; comp.attack.value = .003; comp.release.value = .12;
      const m = c.createGain(); m.gain.value = .6;
      const d = c.createDelay(.5); d.delayTime.value = .095; const fb = c.createGain(); fb.gain.value = .25;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2800; const wet = c.createGain(); wet.gain.value = .2;
      m.connect(comp); m.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(wet); wet.connect(comp); comp.connect(c.destination);
      const nb = c.createBuffer(1, c.sampleRate, c.sampleRate), ch = nb.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      Object.assign(A, { c, m, nb });
    }
    if (A.c.state === 'suspended') A.c.resume();
    return A.c;
  } catch (e) { return null; }
}
function env(g, t, a, peak, dur) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur); }
function tone(type, f0, f1, dur, vol, o = {}) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + (o.at || 0), osc = c.createOscillator(), g = c.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f0, t); if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
  if (o.det) osc.detune.value = o.det;
  env(g, t, o.a || .004, vol, dur);
  let n = osc; if (o.filt) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.filt; f.Q.value = o.q || 1; osc.connect(f); n = f; }
  n.connect(g); g.connect(A.m); osc.start(t); osc.stop(t + dur + .03);
}
function hiss(dur, vol, o = {}) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + (o.at || 0), s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = A.nb; f.type = o.type || 'bandpass'; f.Q.value = o.q || 1.2;
  f.frequency.setValueAtTime(o.f0 || 2000, t); f.frequency.exponentialRampToValueAtTime(o.f1 || o.f0 || 2000, t + dur);
  env(g, t, o.a || .003, vol, dur); s.connect(f); f.connect(g); g.connect(A.m); s.start(t, Math.random() * .5); s.stop(t + dur + .03);
}
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];
const pitch = (base, k) => base * Math.pow(2, PENTA[clamp(k, 0, PENTA.length - 1)] / 12);
const sfx = {
  pop(k) { // paper rip + body thump + pitched pluck climbing the pentatonic scale
    const f = pitch(523.25, k - 1);
    hiss(.09, .4, { f0: 3600, f1: 1200, q: .8 });
    tone('sine', 190, 45, .14, .8);
    tone('triangle', f, f, .26, .2); tone('square', f * 2, f * 2, .08, .045, { filt: 4500 });
    if (k >= 6) tone('sawtooth', f / 2, f / 2, .2, .06, { filt: 1200, q: 4, det: 8 });
  },
  chip(k) { const f = pitch(1568, Math.floor(k / 2)); tone('square', f, f, .03, .05, { filt: 6000 }); tone('sine', f * 1.5, f * 1.5, .06, .06, { at: .01 }); },
  mult(k) { const f = pitch(130.8, k - 1); tone('sawtooth', f, f * 1.5, .15, .13, { filt: 1500, q: 7 }); tone('sine', f * 2, f * 2, .14, .12); },
  badge() { tone('triangle', 1318.5, 1318.5, .12, .12); tone('triangle', 1975.5, 1975.5, .18, .1, { at: .07 }); },
  whoosh() { hiss(.2, .28, { f0: 400, f1: 5000, q: 1.4, a: .07 }); },
  payoff(k) {
    tone('sine', 130, 34, .75, 1); hiss(.5, .26, { type: 'lowpass', f0: 7000, f1: 300, q: .7 });
    const root = 261.63 * Math.pow(2, clamp(k - 1, 0, 7) / 12);
    [0, 4, 7, 12, 16, 19].forEach((s, i) => tone('triangle', root * 2 * Math.pow(2, s / 12), root * 2 * Math.pow(2, s / 12), .55, .11, { at: i * .045 }));
    tone('square', root, root, .3, .05, { filt: 900 });
  },
  coin(p) { const f = 1100 * Math.pow(2, p * 1.3); tone('square', f, f, .028, .03, { filt: 7000 }); tone('sine', f * 1.5, f * 1.5, .05, .045); },
  land() { tone('sine', 95, 48, .2, .7); hiss(.05, .2, { f0: 2600 }); },
  unit() {
    tone('sine', 82, 30, 1, 1); hiss(.7, .14, { type: 'highpass', f0: 3500, f1: 9000, a: .06 });
    [0, 7, 12, 16, 19, 24].forEach((s, i) => tone('triangle', 523.25 * Math.pow(2, s / 12), 523.25 * Math.pow(2, s / 12), .7, .1, { at: .04 + i * .055 }));
  },
  stamp() { tone('sine', 120, 38, .32, 1); hiss(.16, .55, { type: 'lowpass', f0: 1400, f1: 250 }); hiss(.7, .12, { type: 'highpass', f0: 2500, f1: 7000, a: .1, at: .1 }); },
  wave(w) { hiss(.55, .32, { f0: 260, f1: 5200, q: 2, a: .06 }); tone('sine', 110 - w * 12, 32, .7, .95); const f = 196 * Math.pow(2, w * 5 / 12); tone('sawtooth', f, f * 2, .4, .08, { filt: 2200, q: 6 }); },
};
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// ---------- state ----------
const MSG = ['새 메시지가 도착했어요', '지금 확인하지 않으면 사라져요', '쿠폰이 곧 만료돼요', '친구가 회원님을 언급했어요', '새 영상이 올라왔어요', '오늘의 추천이 도착했어요', '배송이 출발했어요'];
const ROW0 = 168, ROWH = 72, CH = 60;
const rowY = i => ROW0 + i * ROWH;
const rows = Array.from({ length: 7 }, (_, i) => ({ app: (i * 3) % APPS.length, n: 1 + (i * 5) % 3, msg: MSG[i % MSG.length], dy: spring(0), sc: spring(1), a: 1, charge: 0 }));
const VAL = [1.2e5, 3.4e5, 8.8e5, 2.1e6];
const wallet = { v: 8.2e7, shown: 8.2e7, from: 8.2e7, to: 8.2e7, t: 1, dur: .6, s: spring(1), us: spring(1), unit: '만', tick: 0, note: null };
const CHIPX = 118, MULTX = 272, BOXY = 129;
const plate = { on: 0, chips: 0, chipsShown: 0, base: 1, syn: 1, wmul: 1, multShown: 1, cs: spring(1), ms: spring(1), xs: spring(1), label: '', labelT: 9, labelSize: 24, k: 0, phase: 'idle', merge: 0, total: 0, ts: spring(1), showT: 0, cap: 0, capMode: false, capT: 9 };
const mult = () => plate.base * plate.syn * plate.wmul;
const parts = [], tokens = [], pops = [], timeline = [];
let stop = 0, slow = 0, shake = 0, zoom = spring(1), flash = 0, heat = 0, busy = false, pending = [], flashTimes = [];
const after = (sec, fn) => timeline.push({ at: sec, fn });

const spawn = (k, x, y, vx, vy, life, col, size, extra) => {
  if (parts.length >= POOL) parts.shift();
  parts.push(Object.assign({ k, x, y, vx, vy, life, max: life, col, size, rot: rnd() * 6.28, vr: (rnd() - .5) * 16 }, extra));
};

// ---------- chain choreography ----------
function runChain(start, n, waves = 0, capMode = false) {
  if (busy) { if (pending.length < 2) pending.push([start, n, waves, capMode]); return; }
  busy = true;
  Object.assign(plate, { chips: 0, chipsShown: 0, base: 1, syn: 1, wmul: 1, multShown: 1, phase: 'chain', merge: 0, k: 0, capMode, cap: 0, capT: 9 });
  let t = 0;
  for (let i = 0; i < n; i++) {
    const idx = ((start - i) % 7 + 7) % 7;
    after(t, () => { rows[idx].charge = 1; kick(rows[idx].sc, 3); });
    after(t + .05, () => burst(idx, i + 1));
    t += Math.max(.1, .19 - i * .011);
  }
  for (let w = 0; w < waves; w++) { after(t + .2, () => waveHit(w)); t += .45; }
  after(t + .38, payoff);
}
function burst(idx, k) {
  const r = rows[idx], app = APPS[r.app], pal = ramp(app.col), T = tier(k), y = rowY(idx) + CH / 2, q = reduce ? .3 : 1;
  const cardCol = day ? [255, 255, 255] : [44, 37, 30];
  for (let s = 0; s < 5; s++) { const x = 14 + s * 72.4 + 36; spawn('SLICE', x, y, (x - 195) * 2.4 + (rnd() - .5) * 90, -160 - rnd() * 240, .75, cardCol, 72, { h: CH, edge: pal[1], vr: (rnd() - .5) * 9 }); }
  spawn('ICON', 47, y, -40 - rnd() * 90, -320 - rnd() * 80, .9, null, 38, { img: r.app, vr: (rnd() - .5) * 12 });
  for (let i = 0; i < T.shreds * q; i++) { const a = rnd() * 6.28, sp = 140 + rnd() * 300; spawn('CONF', 30 + rnd() * 330, y + (rnd() - .5) * 40, Math.cos(a) * sp, Math.sin(a) * sp - 160, .9 + rnd() * .6, pal[1 + (i % 3)], 5 + rnd() * 5); }
  for (let i = 0; i < (10 + k * 2) * q; i++) { const a = rnd() * 6.28, sp = 300 + rnd() * 420; spawn('SPARK', 195 + (rnd() - .5) * 200, y, Math.cos(a) * sp, Math.sin(a) * sp, .22 + rnd() * .25, pal[3], 2.2); }
  spawn('CORE', 195, y, 0, 0, .14, pal[3], 90 + k * 6);
  if (k >= 4) for (let i = 0; i < 8 * q; i++) spawn('STAR', 40 + rnd() * 310, y + (rnd() - .5) * 70, (rnd() - .5) * 50, -40 - rnd() * 50, .5 + rnd() * .4, pal[4], 5 + rnd() * 5);
  if (k >= 6) spawn('RING', 195, y, 0, 0, .5, pal[2], 20);
  // value: pop at the card, then an orb carries it into the chip box
  const val = nice(VAL[r.app % 4] * r.n * (1 + rnd() * .4));
  pops.push({ x: 318, y: y + 8, text: '+' + fmt(val), t: 0, life: .55, col: pal[3] });
  while (pops.length > 3) pops.shift();
  tokens.push({ x0: 318, y0: y, cx: 60 + rnd() * 60, cy: y - 120, x1: CHIPX, y1: BOXY, t: 0, dur: .3, col: pal[2], r: 7, done: () => { plate.chips += val; kick(plate.cs, 14); sfx.chip(k); for (let i = 0; i < 8; i++) spawn('SPARK', CHIPX, BOXY, (rnd() - .5) * 500, (rnd() - .5) * 300, .2, [140, 200, 255], 2); } });
  plate.base = 1 + k; plate.k = k; kick(plate.ms, 12); sfx.mult(k);
  if (k === 3 || k === 7) after(.12, () => tokens.push({ x0: 340, y0: 200, cx: 360, cy: 150, x1: MULTX, y1: BOXY, t: 0, dur: .32, col: [255, 214, 107], text: '시너지 ×1.22', r: 0, done: () => { plate.syn *= 1.22; kick(plate.ms, 16); sfx.badge(); } }));
  plate.label = k === 1 ? '팡!' : `${k}연쇄 ${T.name}!`; plate.labelT = 0; plate.labelSize = 24 + Math.min(k, 12) * 1.4;
  document.querySelectorAll('#ladder tr').forEach(tr => tr.classList.toggle('on', +tr.dataset.a === T.from));
  stop = Math.max(stop, T.stop / 1000);
  if (!reduce) shake = Math.max(shake, T.shake * 1.4);
  heat = Math.max(heat, k >= 6 ? 1 : k >= 4 ? .55 : k >= 2 ? .25 : 0);
  if (k >= 9) {
    slow = .2; if (!reduce) { kick(zoom, 1.2); const now = performance.now(); flashTimes = flashTimes.filter(x => now - x < 1000); if (flashTimes.length < 3) { flash = .32; flashTimes.push(now); } }
  }
  sfx.pop(k); buzz(Math.min(40, 8 + k * 3));
  Object.assign(r, { app: (r.app + 3 + k) % APPS.length, n: 1 + Math.floor(rnd() * 3), msg: MSG[Math.floor(rnd() * MSG.length)], a: 0, charge: 0 });
  r.dy.x = -34; r.dy.v = 0; r.sc.x = .9;
}
function waveHit(w) {
  const pal = ramp(APPS[(w * 4 + 1) % APPS.length].col);

// ---------- controls ----------
const chainsEl = document.getElementById('chains');
const renderChains = () => { chainsEl.innerHTML = [1, 3, 5, 8, 12].map(n => `<button type="button" data-n="${n}" aria-pressed="${n === chainLen}">${n}연쇄</button>`).join(''); };
renderChains();
chainsEl.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; chainLen = +b.dataset.n; renderChains(); runChain(6, chainLen); });
document.getElementById('ladder').innerHTML = LADDER.map(l => `<tr data-a="${l.from}"><td>${l.from === l.to ? l.from : l.to > 50 ? l.from + '+' : l.from + '~' + l.to}</td><td>${l.name}</td><td class="n">${l.stop}ms</td><td class="n">${l.shake}dp</td><td class="n">${l.shreds}</td></tr>`).join('');
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect(), y = (e.clientY - r.top) / r.height * H;
  let idx = rows.findIndex((_, i) => y >= rowY(i) && y <= rowY(i) + CH); if (idx < 0) idx = 6;
  runChain(idx, chainLen);
});
const toggle = (id, fn) => { const b = document.getElementById(id); b.addEventListener('click', () => { const v = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', v); fn(v); }); };
toggle('sound', v => sound = v);
toggle('reduce', v => reduce = v);
toggle('daylight', v => day = v);
toggle('auto', v => { autoOn = v; autoT = 0; });
document.getElementById('wave').addEventListener('click', () => runChain(6, 3, 3));
document.getElementById('cap').addEventListener('click', () => runChain(6, 6, 0, true));
}
</script>
</body>
</html>
