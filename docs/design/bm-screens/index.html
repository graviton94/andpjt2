<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>알림 청소부 BM 화면 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* VOICE: 게임 상점 시안 — 짧고 분명한 상품 문구, 가격은 크게
   IDEA: 반입한 잉크 스티커 에셋을 실제 화면 자리에 얹어 BM v2.1 네 화면을 본다
   PICTURE: 폰 화면 네 장 (상점·패스·프리미엄·출석판)
   COLOUR and TYPE: 게임 판과 같은 어두운 앰버, Black Han Sans 숫자, 데이터 초록·금색 강조
   LAYOUT: 넓으면 네 장 가로, 좁으면 한 장씩 세로 */
:root{color-scheme:light dark;--bg:light-dark(#EEF1F7,#100D0A);--ink:light-dark(#16181D,#F6F1EA);--sub:light-dark(#4B5160,#B3A89B)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip}
header{max-width:1500px;margin:0 auto;padding:28px max(4vw,16px) 8px}
h1{margin:0 0 6px;font-size:clamp(26px,4vw,36px);font-weight:900;letter-spacing:-.02em}
header p{margin:0;color:var(--sub);max-width:70ch}
.screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px;max-width:1500px;margin:0 auto;padding:20px max(4vw,16px) 48px}
figure{margin:0} figcaption{font-weight:700;margin:0 0 8px;font-size:14px;color:var(--sub)}
.phone{background:#0B0907;border-radius:34px;padding:9px;box-shadow:0 20px 50px #0006}
.scr{border-radius:26px;overflow:hidden;background:radial-gradient(120% 70% at 20% 0%,#3a2414,#120d0a 60%),#120d0a;color:#F6F1EA;min-height:690px;padding:14px 14px 18px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#C9BFB3;margin-bottom:10px}
.wallet{display:flex;gap:8px;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 10px 4px 4px;font-family:'Black Han Sans';font-size:16px}
.chip img{width:24px;height:24px}
h2{font-family:'Black Han Sans';font-weight:400;font-size:24px;margin:2px 0 10px;letter-spacing:.01em}
h3{font-size:13px;color:#C9BFB3;margin:14px 0 8px;font-weight:700}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.16);border-radius:18px}
button{font:inherit;font-family:'Black Han Sans';font-size:15px;border:0;border-radius:12px;background:linear-gradient(180deg,#FFD66B,#F0A000);color:#1A0E06;padding:6px 10px;box-shadow:0 3px 0 #1A0E06;cursor:pointer;display:inline-flex;align-items:center;gap:4px;min-height:36px}
img.mini{width:18px;height:18px}
.packs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pack{position:relative;text-align:center;padding:8px 6px 10px} .pack{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);border-radius:16px}
.pack>img{width:100%;aspect-ratio:3/2;object-fit:contain}
.pack b{display:flex;justify-content:center;align-items:center;gap:3px;font-family:'Black Han Sans';font-weight:400;font-size:17px;margin:2px 0 6px}
.first{position:absolute;top:-6px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:900;background:#FF4A3D;color:#fff;border-radius:999px;padding:1px 7px}
.starter{display:flex;align-items:center;gap:10px;padding:10px;margin-top:12px;border-radius:18px;background:linear-gradient(90deg,rgba(255,138,31,.35),rgba(226,46,120,.25));border:1px solid rgba(255,214,107,.5)}
.starter img{width:96px} .starter b{font-family:'Black Han Sans';font-weight:400;font-size:18px;display:block} .starter small{color:#E8DCCB;display:block;font-size:12px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px} .item{background:rgba(255,255,255,.06);border-radius:14px}
.item>img{width:40px;height:40px} .item div{flex:1} .item b{display:block;font-size:14px} .item small{color:#C9BFB3;font-size:12px}
.pass{display:flex;gap:10px;align-items:stretch;padding:12px;margin-bottom:10px;border-radius:20px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06)}
.pass .art{width:92px;display:grid;place-items:center} .pass .art img{width:100%}
.pass .speed{font-family:'Black Han Sans';font-size:30px;line-height:1;background:linear-gradient(180deg,#fff,#FFB020);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #1A0E06)}
.pass ul{margin:6px 0 8px;padding-left:16px;font-size:12.5px;color:#E8DCCB} .pass h4{margin:0;font-size:16px}
.pass.turbo{border-color:#7CC0FF;background:linear-gradient(135deg,rgba(56,103,240,.3),rgba(255,255,255,.04))}
.pass.ultra{border-color:#FFD66B;background:linear-gradient(135deg,rgba(255,138,31,.35),rgba(122,60,255,.25))}
.now{font-size:11px;font-weight:900;background:#34C759;color:#062;border-radius:999px;padding:1px 8px;margin-left:6px}
.note{font-size:11.5px;color:#B3A89B;text-align:center;margin-top:8px}
.prow{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:8px;background:rgba(255,255,255,.06);border-radius:16px}
.pic{position:relative;width:58px;height:58px;flex:none} .pic .app{position:absolute;inset:7px;width:44px;height:44px;border-radius:11px} .pic .frame{position:absolute;inset:0;width:58px;height:58px}
.pinfo{flex:1} .pinfo b{display:block;font-size:14px} .tier{font-size:11.5px;color:#C9BFB3}
.stars{display:flex;gap:1px;margin-top:2px} .stars img{width:16px;height:16px}
.price{display:flex;align-items:center;gap:3px;font-family:'Black Han Sans';font-size:15px;background:linear-gradient(180deg,#6BE38A,#12A150);color:#062;border-radius:12px;padding:6px 9px;box-shadow:0 3px 0 #1A0E06}
.price img{width:18px;height:18px}
.max{font-family:'Black Han Sans';color:#FFD66B}
.voucher{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:10px;border-radius:14px;background:rgba(255,214,107,.15);border:1px dashed rgba(255,214,107,.6);font-size:13px} .voucher img{width:26px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.cell{position:relative;aspect-ratio:1/1.12;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;padding:2px;overflow:hidden}
.cell em{position:absolute;top:2px;left:5px;font-style:normal;font-size:10px;color:#B3A89B}
.cell img{width:56%} .cell b{font-family:'Black Han Sans';font-weight:400;font-size:13px} .cell small{font-size:9.5px;color:#E8DCCB;text-align:center;line-height:1.15}
.cell.big{grid-column:span 5;aspect-ratio:auto;flex-direction:row;gap:10px;padding:8px 12px;justify-content:flex-start;background:linear-gradient(90deg,rgba(255,138,31,.35),rgba(255,214,107,.12));border-color:rgba(255,214,107,.6)}
.cell.big img{width:44px} .cell.big b{font-size:20px} .cell.big small{font-size:12px;text-align:left}
.cell.done{opacity:.55} .cell.today{outline:2px solid #FFD66B;box-shadow:0 0 18px rgba(255,214,107,.5)}
.stamp{position:absolute;right:2px;bottom:2px;font-style:normal;font-size:10px;font-weight:900;color:#FF4A3D;border:2px solid #FF4A3D;border-radius:6px;padding:0 3px;transform:rotate(-12deg)}
.oc{font-family:'Black Han Sans';font-size:18px;color:#7CE0FF}
.streak{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#E8DCCB;margin-bottom:8px}
.streak b{font-family:'Black Han Sans';font-weight:400;font-size:20px;color:#FFD66B}
</style></head><body>
<header><h1>BM 화면 시안 v1</h1><p>17장 BM v2.1을 반입한 UI 에셋으로 그린 네 화면입니다. 가격·수량은 엔진 수치 그대로(데이터 팩 6단계, 데이터 상점, 속도 구독 사다리, 프리미엄 ★ 가격, 30일 연속 출석판). 회색 상자 단계의 배치 확인용이에요.</p></header>

</div></div></figure>

<figure><figcaption>② 패스 · 속도 구독</figcaption><div class="phone"><div class="scr">

</div></div></figure>
