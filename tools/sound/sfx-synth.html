<!DOCTYPE html><html><body><script>
let sound = true, seed = 7;

const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];
const pitch = (base, k) => base * Math.pow(2, PENTA[clamp(k, 0, PENTA.length - 1)] / 12);

  pop(k) { // paper rip + body thump + pitched pluck climbing the pentatonic scale

    tone('triangle', f, f, .26, .2); tone('square', f * 2, f * 2, .08, .045, { filt: 4500 });

  chip(k) { const f = pitch(1568, Math.floor(k / 2)); tone('square', f, f, .03, .05, { filt: 6000 }); tone('sine', f * 1.5, f * 1.5, .06, .06, { at: .01 }); },
  mult(k) { const f = pitch(130.8, k - 1); tone('sawtooth', f, f * 1.5, .15, .13, { filt: 1500, q: 7 }); tone('sine', f * 2, f * 2, .14, .12); },
  badge() { tone('triangle', 1318.5, 1318.5, .12, .12); tone('triangle', 1975.5, 1975.5, .18, .1, { at: .07 }); },

  payoff(k) {

  coin(p) { const f = 1100 * Math.pow(2, p * 1.3); tone('square', f, f, .028, .03, { filt: 7000 }); tone('sine', f * 1.5, f * 1.5, .05, .045); },
  land() { tone('sine', 95, 48, .2, .7); hiss(.05, .2, { f0: 2600 }); },
  unit() {
    tone('sine', 82, 30, 1, 1); hiss(.7, .14, { type: 'highpass', f0: 3500, f1: 9000, a: .06 });
    [0, 7, 12, 16, 19, 24].forEach((s, i) => tone('triangle', 523.25 * Math.pow(2, s / 12), 523.25 * Math.pow(2, s / 12), .7, .1, { at: .04 + i * .055 }));
  },
  snap() { tone('square', 2400, 2400, .02, .05, { filt: 7000 }); tone('sine', 1100, 700, .05, .09); },
  stamp() { tone('sine', 120, 38, .32, 1); hiss(.16, .55, { type: 'lowpass', f0: 1400, f1: 250 }); hiss(.7, .12, { type: 'highpass', f0: 2500, f1: 7000, a: .1, at: .1 }); },
  wave(w) { hiss(.55, .32, { f0: 260, f1: 5200, q: 2, a: .06 }); tone('sine', 110 - w * 12, 32, .7, .95); const f = 196 * Math.pow(2, w * 5 / 12); tone('sawtooth', f, f * 2, .4, .08, { filt: 2200, q: 6 }); },
};
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

Object.assign(sfx, {
  beep(h) { const f = 1800 + h * 900; tone('square', f, f, .05, .05, { filt: 5000 }); },
  boil() { hiss(.55, .45, { type: 'lowpass', f0: 300, f1: 1400, q: 3, a: .04 }); tone('sine', 72, 48, .55, .7); },
  steam() { hiss(1.3, .5, { type: 'highpass', f0: 3200, f1: 1400, q: .7, a: .02 }); hiss(.45, .3, { type: 'bandpass', f0: 6500, f1: 1800, q: 1 }); tone('sine', 900, 180, .9, .08, { at: .1 }); },
  siren(d) {
    const c = ac(); if (!c) return;
    const t0 = c.currentTime, o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 2200;
    for (let i = 0; i <= d / .28; i++) o.frequency.setValueAtTime(i % 2 ? 640 : 880, t0 + i * .28);
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.11, t0 + .03); g.gain.setValueAtTime(.11, t0 + d - .3); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(f); f.connect(g); g.connect(A.m); o.start(t0); o.stop(t0 + d + .05);
  },
  drill(n) { const f = pitch(659, n % 12); tone('square', f, f, .05, .06, { filt: 3500 }); tone('sine', 130, 60, .06, .4); },
  glitch() { hiss(.4, .35, { type: 'bandpass', f0: 700, f1: 4200, q: 8 }); for (let i = 0; i < 7; i++) tone('square', 200 + rnd() * 1600, 90 + rnd() * 700, .045, .05, { at: i * .05 }); },
  powerDown() { tone('sine', 1300, 38, .38, .25); hiss(.3, .15, { type: 'highpass', f0: 6500, f1: 900 }); },
  boot() { tone('sine', 55, 130, .3, .5); [0, 7, 12, 16].forEach((s, i) => tone('triangle', 392 * Math.pow(2, s / 12), 392 * Math.pow(2, s / 12), .45, .1, { at: .12 + i * .08 })); },
  ring() { for (let i = 0; i < 8; i++) { const f = i % 2 ? 1320 : 1660; tone('sine', f, f, .045, .08, { at: i * .045 }); } },
  smash() { hiss(.45, .6, { type: 'highpass', f0: 2500, f1: 8500, a: .002 }); for (let i = 0; i < 9; i++) { const f = 2000 + rnd() * 3500; tone('triangle', f, f * .7, .09, .04, { at: rnd() * .22 }); } tone('sine', 120, 40, .32, .9); },
  heart() { tone('sine', 72, 44, .15, .55); tone('sine', 66, 40, .15, .4, { at: .17 }); },
  zap() { hiss(.28, .55, { type: 'bandpass', f0: 3200, f1: 500, q: 2 }); tone('sawtooth', 70, 1800, .22, .12, { filt: 3200 }); tone('sine', 220, 880, .6, .16, { at: .14 }); },
  reel() { tone('square', 2600, 2600, .015, .03, { filt: 6000 }); },
  jackpot() { tone('sine', 110, 38, 1, 1); [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => { const f = 523.25 * Math.pow(2, s / 12); tone('square', f, f, .26, .05, { at: i * .06, filt: 4200 }); }); hiss(1.1, .12, { type: 'highpass', f0: 5000, f1: 9500, a: .1 }); },
  fail() { [0, -1, -2, -5].forEach((s, i) => tone('sawtooth', 233 * Math.pow(2, s / 12), 233 * Math.pow(2, (s - .8) / 12), i === 3 ? .75 : .28, .09, { at: i * .3, filt: 1100 })); },
  pad() { [261.63, 392, 523.25, 659.25].forEach((f, i) => tone('sine', f, f, 3.2, .06, { a: .9, at: i * .05 })); },
  soft() { hiss(.32, .07, { type: 'lowpass', f0: 1300, f1: 400, a: .08 }); tone('sine', 1568, 1568, .45, .035); },
  snapback() { tone('sine', 900, 1400, .08, .06); },

ac = () => A.c;  // offline: no resume
// Render one call into an OfflineAudioContext with the same master chain as the demo.
async function render(call, secs) {
  const c = new OfflineAudioContext(1, Math.ceil(48000 * secs), 48000);
  const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 5; comp.attack.value = .003; comp.release.value = .12;
  const m = c.createGain(); m.gain.value = .6;
  const d = c.createDelay(.5); d.delayTime.value = .095; const fb = c.createGain(); fb.gain.value = .25;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2800; const wet = c.createGain(); wet.gain.value = .2;
  m.connect(comp); m.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(wet); wet.connect(comp); comp.connect(c.destination);

}
window.render = render;
