<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>알림 청소부</title>
<link rel="stylesheet" href="fonts/black-han-sans/index.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}

/* ---- pull-down shade + sheets (screens-v1 Shade · Shop · Upgrade · Deck · Reset, dark) ---- */
:root{color-scheme:dark;--bg:#0D0907;--ink:#F6F1EA;--sub:#B3A89B;--line:#FFFFFF1A;--card:#FFFFFF14;--soft:#FFFFFF14;--soft2:#FFFFFF1F;--dash:#FFFFFF33;
 --sheet:#17120E;--shade:linear-gradient(180deg,#2A2119f2,#15120Ff7);--acc:#EFA03F;--on-acc:#1E1408;--acc2:#F6C453;--gold:#FFD66B;--hot:#FFB060;
 --dis:#FFFFFF14;--dis-ink:#FFFFFF66;--pack:linear-gradient(180deg,#3A2A1C,#21170F);--hero:radial-gradient(circle at 50% 0,#EFA03F33,#FFFFFF0d);
 --bigday:linear-gradient(90deg,#4A3212,#2A1C0E);--ok:#5BD68A;--ok-bg:#5BD68A24;--bad:#FF6B5A;--grab:#F6F1EA88}
/* light theme = screens-v1 Main · Shop (white cards, blue accent) */
@media (prefers-color-scheme: light){:root{color-scheme:light;--bg:#EEF1F7;--ink:#16181D;--sub:#5F6674;--line:#E6EAF2;--card:#FFFFFF;--soft:#1E2A5012;--soft2:#1E2A501C;--dash:#1E2A5033;
 --sheet:#F4F6FB;--shade:linear-gradient(180deg,#FFFFFFf4,#EEF1F7f8);--acc:#3867F0;--on-acc:#FFFFFF;--acc2:#B25F00;--gold:#C07A00;--hot:#C05A00;
 --dis:#1E2A5014;--dis-ink:#8A90A0;--pack:linear-gradient(180deg,#FFFFFF,#EEF2FA);--hero:radial-gradient(circle at 50% 0,#3867F022,#FFFFFF);
 --bigday:linear-gradient(90deg,#FFF1CF,#FFE3A6);--ok:#0E7A3E;--ok-bg:#18A95724;--bad:#D81E2A;--grab:#16181D55}}
.ov{position:fixed;inset:0;color:var(--ink);font:14px/1.4 "Noto Sans KR",system-ui,sans-serif;pointer-events:none}
.ov.open{pointer-events:auto}
#scrim{position:fixed;inset:0;background:#000a;opacity:0;transition:opacity .22s;pointer-events:none}
#scrim.open{opacity:1;pointer-events:auto}
#shade{position:fixed;left:0;right:0;top:0;max-height:92vh;color:var(--ink);font:14px/1.4 "Noto Sans KR",system-ui,sans-serif;overflow:auto;padding:18px 16px 14px;border-radius:0 0 28px 28px;
 background:var(--shade);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px #000c;
 transform:translateY(-104%);transition:transform .32s cubic-bezier(.2,1,.3,1)}
#shade.open{transform:none}
.sh-top{display:flex;align-items:baseline;justify-content:space-between}
.sh-wallet{font:30px "Black Han Sans",sans-serif;letter-spacing:-.01em}
.sh-wallet small{font-size:18px;color:var(--acc2)}
.lv{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-size:12px;color:var(--sub)}
.lv b{background:var(--acc);color:var(--on-acc);border-radius:999px;padding:1px 8px;font-size:12px}
.bar{flex:1;height:8px;border-radius:999px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#F6C453,#FFD66B)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;margin:16px 0 8px}
.tile{background:none;border:0;color:inherit;font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0}
.tile span.c{width:56px;height:56px;border-radius:999px;display:grid;place-items:center;background:var(--soft2)}
.tile.hot span.c{background:var(--acc);color:var(--on-acc);box-shadow:0 6px 16px #00000030}
.tile.lock{opacity:.45}
.tile b{font-size:12.5px;font-weight:700}.tile em{font-style:normal;font-size:11px;color:var(--sub);margin-top:-3px}
.row2{display:flex;align-items:center;gap:10px;margin:10px 2px}.row2 label{font-size:12px;color:var(--sub);width:48px}
.row2 input{flex:1;accent-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{background:var(--soft);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.grab{width:44px;height:5px;border-radius:9px;background:var(--grab);margin:12px auto 0}
#sheet{position:fixed;left:0;right:0;bottom:0;height:88vh;display:flex;flex-direction:column;background:var(--sheet);color:var(--ink);font:14px/1.4 "Noto Sans KR",system-ui,sans-serif;border-radius:26px 26px 0 0;
 box-shadow:0 -14px 40px #000c;transform:translateY(104%);transition:transform .3s cubic-bezier(.2,1,.3,1)}
#sheet.open{transform:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.sheet-h h2{flex:1;margin:0;font:22px "Black Han Sans",sans-serif}
.sheet-h .w{font-weight:800;color:var(--acc2)}
.x{background:var(--soft2);border:0;color:var(--ink);width:36px;height:36px;border-radius:999px;font-size:18px}
.sheet-b{flex:1;overflow:auto;padding:4px 14px 30px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.seg button{flex:none;height:32px;padding:0 12px;border-radius:999px;border:0;font:inherit;font-size:12.5px;font-weight:700;background:var(--soft);color:var(--ink)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.it{min-height:66px;padding:10px 12px;border-radius:20px;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.it.lock{background:var(--soft)}.it.lock img{filter:grayscale(1);opacity:.5}
.it img{width:40px;height:40px;border-radius:11px;flex:none}
.fr{position:relative;flex:none;width:58px;height:58px;margin:-9px -7px}
.fr img{position:absolute;margin:0}.fr img.ring{inset:0;width:100%;height:100%;border-radius:0;z-index:1}
.slot .fr{width:52px;height:52px;margin:-6px 0 -8px}
.it .t{flex:1;min-width:0}.it .t b{font-size:14.5px}.it .t .m{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tier{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;color:var(--acc2)}
.btn{flex:none;min-width:88px;height:40px;padding:0 12px;border-radius:999px;border:0;font:inherit;font-size:12.5px;font-weight:800;background:var(--acc);color:var(--on-acc)}
.btn:disabled{background:var(--dis);color:var(--dis-ink)}.btn.own{background:var(--ok-bg);color:var(--ok)}
.btn.big{width:100%;height:52px;font-size:16px;margin:6px 0 12px}
.prog{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:5px}.prog i{display:block;height:100%;border-radius:999px;background:#3867F0}.prog i.hot{background:#FF8A1F}
.note{font-size:11.5px;color:var(--sub)}.note.hot{color:var(--hot);font-weight:700}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.slot{height:84px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--card);border:1px solid var(--line);font-size:11.5px;font-weight:700;color:inherit;font-family:inherit}
.slot img{width:36px;height:36px;border-radius:10px}.slot.empty{background:transparent;border:1.5px dashed var(--dash);color:var(--sub)}
.syn{display:grid;grid-template-columns:96px 1fr 58px;align-items:center;gap:8px;font-size:12.5px;margin:6px 0}.syn .v{text-align:right;font-weight:800;color:var(--acc2)}
.hero{text-align:center;padding:14px;border-radius:22px;background:var(--hero);margin-bottom:12px}
.hero b{display:block;font:44px "Black Han Sans",sans-serif;color:var(--gold)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.cols div{background:var(--card);border-radius:16px;padding:10px 12px;font-size:12.5px}
.cols h4{margin:0 0 4px;font-size:12px;color:var(--sub)}
.h3{font-size:12.5px;color:var(--sub);margin:14px 2px 8px;font-weight:700}
.cur{display:flex;gap:6px;flex-wrap:wrap}.cur span{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:3px 10px 3px 4px;font-weight:800;font-size:13px}.cur img{width:22px;height:22px}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pack{position:relative;border-radius:18px;padding:22px 6px 8px;text-align:center;background:var(--pack);border:1px solid var(--line);color:inherit;font:inherit}
.pack img{width:64px;height:64px;object-fit:contain}.pack .n{font-weight:900;font-size:15px;margin:2px 0 6px}
.pack .won{display:block;border-radius:999px;background:linear-gradient(180deg,#FFD66B,#F0A000);color:#2A1606;font-weight:900;padding:7px 0;font-size:13px}
.rib{position:absolute;top:-1px;left:50%;transform:translateX(-50%);background:#FF3B30;color:#fff;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:0 0 9px 9px;white-space:nowrap}
.starter{display:flex;gap:10px;align-items:center;border-radius:18px;padding:12px;background:linear-gradient(90deg,#5A1E2E,#3A1A12);border:1px solid #FF8A6B55;margin-bottom:6px;color:#FFF4EC;font:inherit;text-align:left;width:100%}
.starter img{width:64px;height:64px}.starter .note{color:#FFD9CC}.starter b{font:20px "Black Han Sans",sans-serif}
.dbtn{flex:none;min-width:70px;height:38px;border-radius:12px;border:0;font:inherit;font-weight:900;background:linear-gradient(180deg,#9BE37A,#4FB43A);color:#123006;display:flex;align-items:center;justify-content:center;gap:4px}
.dbtn img{width:18px;height:18px}.dbtn:disabled{filter:grayscale(1);opacity:.45}
.adbtn{background:linear-gradient(180deg,#7CC4FF,#2F7BF5);color:#fff}
.passc{border-radius:20px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;border:1px solid #FFFFFF22;color:#F6F1EA}
.passc .btn{background:#FFD66B;color:#1E1408}
.passc .big{font:34px "Black Han Sans",sans-serif;color:#fff;width:74px;text-align:center}.passc img{width:74px}
.passc ul{margin:6px 0 8px;padding-left:16px;font-size:12px;color:#E9E3DC}.passc h3{margin:0;font:18px "Black Han Sans",sans-serif}
.on-tag{background:#5BD68A;color:#0E3B1F;border-radius:999px;font-size:11px;font-weight:900;padding:2px 8px;margin-left:6px}
.stars img{width:16px;height:16px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{position:relative;border-radius:12px;background:var(--card);border:1px solid var(--line);min-height:66px;padding:4px 2px;text-align:center;font-size:11px}
.day i{position:absolute;left:5px;top:3px;font-style:normal;font-size:10px;color:var(--sub)}
.day img{width:28px;height:28px;margin-top:10px}.day b{display:block;font-size:12px}
.day.got{opacity:.55}.day.got::after{content:"출석";position:absolute;right:3px;bottom:3px;border:2px solid #FF3B30;color:#FF3B30;border-radius:6px;font-size:10px;font-weight:900;padding:0 3px;transform:rotate(-12deg)}
.day.now{border:2px solid var(--gold);box-shadow:0 0 14px #FFC23D66;opacity:1}
.day.big{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;background:var(--bigday);border-color:#FFC23D66;min-height:54px}
.day.big img{margin:0;width:36px;height:36px}.day.big b{font:20px "Black Han Sans",sans-serif;color:var(--gold)}
.mis{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}.mis .bar{height:6px}
#adov{position:fixed;inset:0;background:#000;color:#fff;display:none;place-items:center;text-align:center;font:16px "Noto Sans KR",sans-serif;z-index:50}
#adov.on{display:grid}#adov b{display:block;font:28px "Black Han Sans",sans-serif;margin-bottom:8px}
#offer{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) scale(.8);opacity:0;pointer-events:none;transition:.25s;border:0;border-radius:999px;padding:12px 18px;font:800 15px "Noto Sans KR",sans-serif;
 background:linear-gradient(180deg,#7CC4FF,#2F7BF5);color:#fff;box-shadow:0 8px 24px #2F7BF566;z-index:20}
#offer.on{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}

</style>
</head>
<body>
<canvas id="stage" aria-label="알림 판"></canvas>
<div id="scrim"></div><div id="adov"><div><b>광고</b>광고 SDK 연결 전 가짜 광고예요<br><span id="adt">3</span>초 뒤 보상</div></div><button id="offer"></button><div id="shade"></div><div id="sheet"><div class="sheet-h"><h2 id="sheet-t"></h2><span class="w" id="sheet-w"></span><button class="x" id="sheet-x" aria-label="닫기">✕</button></div><div class="sheet-b" id="sheet-b"></div></div>
<script>
{
const COLORS = __COLORS__;  // app id → brand colour (ui/AppStyle)
const LADDER = [
  { from: 1, to: 1, name: '팡', stop: 28, shake: 1.5, shreds: 12 },
  { from: 2, to: 3, name: '연쇄', stop: 36, shake: 2.0, shreds: 20 },
  { from: 4, to: 5, name: '폭주', stop: 48, shake: 2.5, shreds: 32 },
  { from: 6, to: 8, name: '대폭주', stop: 60, shake: 3.0, shreds: 48 },
  { from: 9, to: 99, name: '알림 해일', stop: 80, shake: 3.0, shreds: 64 },
];
const W = 390, H = Math.max(740, Math.round(390 * (innerHeight || 740) / (innerWidth || 390))), EX = H - 740, SIM = 1 / 120, POOL = 600;
const FD = '"Black Han Sans","Noto Sans KR",sans-serif', FB = '"Noto Sans KR",sans-serif';
const cv = document.getElementById('stage');
const gl = cv.getContext('webgl', { premultipliedAlpha: false, antialias: false, preserveDrawingBuffer: true });
const out2d = gl ? null : cv.getContext('2d');
// everything is drawn into an offscreen 2D scene, then a shader bends it on the way to the screen
const scene = document.createElement('canvas'), sctx = scene.getContext('2d');
const ui = document.createElement('canvas'), uctx = ui.getContext('2d');
let ctx = sctx;
const bgS = document.createElement('canvas'); bgS.width = 66; bgS.height = 124; const bctx = bgS.getContext('2d');
const bgT = document.createElement('canvas'); bgT.width = 18; bgT.height = 34; const tctx = bgT.getContext('2d');
const HANDSET = new Image(); HANDSET.src = __HANDSET__;
const ICON = {};
const icon = id => ICON[id] || (ICON[id] = Object.assign(new Image(), { src: 'icons/' + id + '.svg' }));
const GLOVE = Object.assign(new Image(), { src: 'img/hand-swipe.png' });
const colOf = d => d.kind === 'Spam' || d.kind === 'Call' ? '#FF3B30' : d.kind === 'Wild' ? '#9B5CFF' : d.kind === 'Event' ? '#EFA03F' : d.kind === 'Alert' ? '#8E8E93' : (COLORS[d.app] || '#EFA03F');
let dpr = 1;
const fit = () => { dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = scene.width = ui.width = W * dpr; cv.height = scene.height = ui.height = H * dpr; if (gl) gl.viewport(0, 0, cv.width, cv.height); };
fit(); window.addEventListener('resize', fit);
if (document.fonts) { document.fonts.load('40px "Black Han Sans"'); document.fonts.load('700 14px "Noto Sans KR"'); }

const lightQ = matchMedia('(prefers-color-scheme: light)');
let sound = true, reduce = false, day = lightQ.matches, vol = 1, vibOn = true;
const TEXTS = __TEXTS__;  // app id → [effect line, [messages]] (docs/content/app-texts.json)
let seed = 11;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const backOut = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const tier = n => LADDER.find(l => n >= l.from && n <= l.to);
const spring = (v = 1) => ({ x: v, v: 0, t: v });
const kick = (s, a) => { s.v += a; };
const stepSpring = (s, dt, k = 340, d = 13) => { s.v += (-k * (s.x - s.t) - d * s.v) * dt; s.x += s.v * dt; };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixc = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const ramp = h => { const c = hex(h); return [mixc(c, [0, 0, 0], .45), c, mixc(c, [255, 255, 255], .35), mixc(c, [255, 255, 255], .7), [255, 255, 255]]; };
// global idle notation: 999 · 1.23K · 12.3K · 123K · M · B · T · aa, ab …
const SUF = g => g === 0 ? '' : g < 5 ? ['K', 'M', 'B', 'T'][g - 1] : String.fromCharCode(97 + Math.floor((g - 5) / 26)) + String.fromCharCode(97 + (g - 5) % 26);
const split = n => {
  if (n < 1000) return { num: String(Math.floor(n)), unit: '' };
  const g = Math.floor(Math.log10(n) / 3), x = n / Math.pow(1000, g), d = x >= 100 ? 0 : x >= 10 ? 1 : 2, f = Math.pow(10, d);
  return { num: String(Math.floor(x * f) / f), unit: SUF(g) };
};
const fmt = n => { const s = split(n); return s.num + s.unit; };
const fmtMult = m => m >= 1000 ? fmt(m) : String(Math.round(m * 10) / 10);
const nice = v => { const p = Math.pow(10, Math.floor(Math.log10(v)) - 1); return Math.round(v / p) * p; };

// ---------- sound: layered synth through compressor + short echo ----------
const A = {};
function ac() {
  if (!sound) return null;
  try {
    if (!A.c) {
      const c = new (window.AudioContext || window.webkitAudioContext)();
      const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 5; comp.attack.value = .003; comp.release.value = .12;
      const m = c.createGain(); m.gain.value = .6 * vol;
      const d = c.createDelay(.5); d.delayTime.value = .095; const fb = c.createGain(); fb.gain.value = .25;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2800; const wet = c.createGain(); wet.gain.value = .2;
      m.connect(comp); m.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(wet); wet.connect(comp); comp.connect(c.destination);
      const nb = c.createBuffer(1, c.sampleRate, c.sampleRate), ch = nb.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      Object.assign(A, { c, m, nb });
    }
    if (A.c.state === 'suspended') A.c.resume();
    return A.c;
  } catch (e) { return null; }
}
function env(g, t, a, peak, dur) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur); }
function tone(type, f0, f1, dur, vol, o = {}) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + (o.at || 0), osc = c.createOscillator(), g = c.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f0, t); if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
  if (o.det) osc.detune.value = o.det;
  env(g, t, o.a || .004, vol, dur);
  let n = osc; if (o.filt) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.filt; f.Q.value = o.q || 1; osc.connect(f); n = f; }
  n.connect(g); g.connect(A.m); osc.start(t); osc.stop(t + dur + .03);
}
function hiss(dur, vol, o = {}) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + (o.at || 0), s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = A.nb; f.type = o.type || 'bandpass'; f.Q.value = o.q || 1.2;
  f.frequency.setValueAtTime(o.f0 || 2000, t); f.frequency.exponentialRampToValueAtTime(o.f1 || o.f0 || 2000, t + dur);
  env(g, t, o.a || .003, vol, dur); s.connect(f); f.connect(g); g.connect(A.m); s.start(t, Math.random() * .5); s.stop(t + dur + .03);
}
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28, 31, 33, 36];
const pitch = (base, k) => base * Math.pow(2, PENTA[clamp(k, 0, PENTA.length - 1)] / 12);
const sfx = {
  pop(k) { // paper rip + body thump + pitched pluck climbing the pentatonic scale
    const f = pitch(523.25, k - 1);
    hiss(.09, .4, { f0: 3600, f1: 1200, q: .8 });
    tone('sine', 190, 45, .14, .8);
    tone('triangle', f, f, .26, .2); tone('square', f * 2, f * 2, .08, .045, { filt: 4500 });
    if (k >= 6) tone('sawtooth', f / 2, f / 2, .2, .06, { filt: 1200, q: 4, det: 8 });
  },

// ---------- engine bridge: the Android app (window.Game) or the desktop dev server ----------
let S = null;  // last engine snapshot
async function api(method, args = {}) {
  if (window.Game) return JSON.parse(window.Game.call(method, JSON.stringify(args)));
  const q = new URLSearchParams(args).toString();
  return (await fetch('/api/' + method + (q ? '?' + q : ''))).json();
}

/** Replace the board with the engine's rows: known rows keep their springs, new ones drop in from the top. */
function reconcile(st, arrivals = []) {
  const keep = new Map(board.map(r => [r.id, r]));
  board.length = 0;
  let drop = 0;
  st.rows.forEach((d, i) => {
    let r = keep.get(d.id);
    if (r) { r.d = d; }
    else {
      const k = arrivals.indexOf(d.id); drop++;
      r = mkRow(d, rowY(0) - ROWH * (1.2 + drop * .55)); r.a = 0;
      if (k >= 0) after(.06 * drop, () => { ping(d); kick(r.sc, 2); });
      if (d.kind === 'Call') pendingCall = d.id;
    }
    board.push(r);
  });
  layout();
}
function applyState(st) {
  S = st; const w = Number(st.wallet);
  if (Math.abs(w - wallet.v) > 1e-6 * Math.max(1, w) && plate.phase === 'idle') { wallet.v = wallet.to = w; if (wallet.t >= 1) wallet.shown = w; }
}

const DIMG = '<img src="img/bm/currency-data.webp">';

async function sheetAct(x) {

  const o = await api(act, args);
  if (act === 'reset' && o.ok) { closeAll(); say2('공장 초기화! 백업파일 받음', 300, 26); collapse(1.3); sfx.unit(); buzz([40, 30, 80]); }
  afterAct(o);
}
const offerEl = $('offer');

async function afterAct(o, failMsg) {

  armReset = false; await loadPanel(); if (sheetKind) renderSheet();
}
