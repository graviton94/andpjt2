<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/black-han-sans/index.css"><link rel="stylesheet" href="fonts/luckiest-guy/index.css">
<style>
*{margin:0;box-sizing:border-box}
body{width:512px;height:512px;overflow:hidden;position:relative;
 background:radial-gradient(circle at 66% 50%,#ffb347 0,#ff7a1a 22%,#b83c0c 52%,#3a1708 82%,#1e0c05 100%)}
.rays{position:absolute;inset:-200px;background:repeating-conic-gradient(from 4deg at 66% 50%,#ffffff1c 0 7deg,transparent 7deg 18deg);}
.card{position:absolute;border-radius:30px;background:#f8efe2;box-shadow:0 10px 0 #0004}
.c3{left:-70px;top:300px;width:300px;height:96px;transform:rotate(9deg);background:#c99a6c}
.c2{left:-40px;top:222px;width:300px;height:100px;transform:rotate(-5deg);background:#e2c29c}
.main{left:40px;top:120px;width:330px;height:124px;transform:rotate(-13deg);overflow:visible}
.app{position:absolute;left:20px;top:20px;width:84px;height:84px;border-radius:22px;background:linear-gradient(#ffb03a,#ff6a00);display:grid;place-items:center}
.line{position:absolute;height:16px;border-radius:8px;background:#6d5444}
.shard{position:absolute;background:#f8efe2;box-shadow:0 6px 0 #0004}
.streak{position:absolute;height:12px;border-radius:6px;background:#fff6d8}
.boom{position:absolute;right:-6px;top:150px;width:250px;height:250px;transform:rotate(14deg);
 clip-path:polygon(50% 0,58% 30%,80% 6%,72% 36%,100% 26%,80% 50%,100% 70%,70% 66%,82% 96%,56% 74%,46% 100%,40% 72%,14% 92%,26% 62%,0 58%,24% 44%,6% 18%,34% 30%);
 background:#ffe14a}
.boom2{position:absolute;right:14px;top:170px;width:210px;height:210px;transform:rotate(14deg);clip-path:inherit;background:#fff}
.pang{position:absolute;right:30px;top:218px;transform:rotate(-10deg);font:110px/1 'Black Han Sans';color:#ff3b30;
 -webkit-text-stroke:10px #3a0f02;paint-order:stroke fill;text-shadow:0 8px 0 #3a0f02}
.badge{position:absolute;left:18px;top:24px;transform:rotate(-14deg);background:#ff2d2d;border:9px solid #fff;border-radius:60px;
 padding:14px 22px 4px;font:84px/1 'Luckiest Guy';color:#fff;box-shadow:0 9px 0 #3a0f02}
.spark{position:absolute;background:#fff6c8;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
</style></head><body>
<div class="rays"></div>
<div class="card c3"></div><div class="card c2"></div>
<div class="streak" style="left:-20px;top:210px;width:110px;transform:rotate(-13deg)"></div>
<div class="streak" style="left:-30px;top:250px;width:80px;transform:rotate(-13deg);opacity:.7"></div>
<div class="card main">
  <div class="app"><svg width="50" height="54" viewBox="0 0 50 54"><path fill="#fff" d="M25 0c3 0 5 2 5 5v1c8 2 13 9 13 18v12l6 8H1l6-8V24c0-9 5-16 13-18V5c0-3 2-5 5-5zM18 48h14a7 7 0 0 1-14 0z"/></svg></div>
  <div class="line" style="left:122px;top:32px;width:150px"></div>
  <div class="line" style="left:122px;top:68px;width:100px;background:#b29a86"></div>
</div>
<div class="shard" style="left:368px;top:86px;width:58px;height:46px;transform:rotate(28deg);clip-path:polygon(0 0,100% 20%,70% 100%,10% 70%)"></div>
<div class="shard" style="left:420px;top:150px;width:40px;height:34px;transform:rotate(-30deg);clip-path:polygon(20% 0,100% 40%,50% 100%,0 60%)"></div>
<div class="shard" style="left:440px;top:60px;width:26px;height:22px;transform:rotate(60deg);clip-path:polygon(0 0,100% 30%,40% 100%)"></div>
<div class="boom"></div><div class="boom" style="right:22px;top:176px;width:200px;height:200px;background:#fff"></div>
<div class="pang">팡!</div>
<div class="badge">99+</div>
<div class="spark" style="left:420px;top:410px;width:54px;height:54px"></div>
<div class="spark" style="left:250px;top:420px;width:30px;height:30px"></div>
<div class="spark" style="left:470px;top:20px;width:34px;height:34px"></div>
</body></html>
