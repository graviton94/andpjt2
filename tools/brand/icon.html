<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/black-han-sans/index.css"><link rel="stylesheet" href="fonts/luckiest-guy/index.css">
<link rel="stylesheet" href="fonts/dela-gothic-one/index.css"><link rel="stylesheet" href="fonts/noto-sans-tc/index.css">
<style>
*{margin:0;box-sizing:border-box}
body{width:512px;height:512px;overflow:hidden;position:relative;
 background:radial-gradient(circle at 66% 62%,#ffb347 0,#ff7a1a 22%,#b83c0c 52%,#3a1708 82%,#1e0c05 100%)}
.rays{position:absolute;inset:-200px;background:repeating-conic-gradient(from 4deg at 66% 62%,#ffffff1c 0 7deg,transparent 7deg 18deg)}
.card{position:absolute;border-radius:30px;background:#f8efe2;box-shadow:0 10px 0 #0004}
.c3{left:-120px;top:280px;width:300px;height:96px;transform:rotate(9deg);background:#c99a6c}
.c2{left:-100px;top:200px;width:300px;height:100px;transform:rotate(-5deg);background:#e2c29c}
.main{left:-30px;top:96px;width:300px;height:118px;transform:rotate(-14deg)}
.app{position:absolute;left:44px;top:18px;width:82px;height:82px;border-radius:22px;background:linear-gradient(#ffb03a,#ff6a00);display:grid;place-items:center}
.line{position:absolute;height:16px;border-radius:8px;background:#6d5444}
.fx{position:absolute;pointer-events:none}
.badge{position:absolute;left:16px;top:18px;transform:rotate(-14deg);background:#ff2d2d;border:9px solid #fff;border-radius:60px;
 padding:14px 22px 4px;font:80px/1 'Luckiest Guy';color:#fff;box-shadow:0 9px 0 #3a0f02;z-index:5}
.word{position:absolute;left:180px;top:200px;width:300px;height:250px;display:grid;place-items:center;transform:rotate(-10deg);z-index:4}
.word span{color:#ff3b30;-webkit-text-stroke:12px #3a0f02;paint-order:stroke fill;text-shadow:0 9px 0 #3a0f02;white-space:nowrap;line-height:1}
</style></head><body>
<div class="rays"></div>
<div class="card c3"></div><div class="card c2"></div>
<img class="fx" src="../../docs/design/ui-assets/comic-fx/swipe-trail.png" style="left:-60px;top:150px;width:230px;transform:rotate(-14deg) scaleX(-1)">
<div class="card main">
  <div class="app"><svg width="48" height="52" viewBox="0 0 50 54"><path fill="#fff" d="M25 0c3 0 5 2 5 5v1c8 2 13 9 13 18v12l6 8H1l6-8V24c0-9 5-16 13-18V5c0-3 2-5 5-5zM18 48h14a7 7 0 0 1-14 0z"/></svg></div>
  <div class="line" style="left:144px;top:30px;width:130px"></div>
  <div class="line" style="left:144px;top:66px;width:90px;background:#b29a86"></div>
</div>
<!-- the blast is bigger than the icon: cut by the right and bottom edges on purpose -->
<img class="fx" src="../../docs/design/ui-assets/comic-fx/impact-flash.png" style="left:150px;top:150px;width:420px;opacity:.9">
<div id="boom"></div>
<img class="fx" src="../../docs/design/ui-assets/comic-fx/shards.png" style="left:250px;top:-40px;width:230px;transform:rotate(20deg)">
<div class="badge">99+</div>
<script src="bubbles.js"></script>
<script>
const L=new URLSearchParams(location.search).get('lang')||'ko';
const W={ko:['팡!','Black Han Sans'],en:['POP!','Luckiest Guy'],ja:['パン!','Dela Gothic One'],'zh-TW':['砰!','Noto Sans TC'],es:['¡PUM!','Luckiest Guy']}[L];
window.__ready=false;
boom.innerHTML=bubble({name:'burst-big',x:70,y:66,w:560,rot:-8,tilt:-4,text:W[0],family:W[1],weight:L==='zh-TW'?900:400,stroke:12,shadow:9,fillW:1.3,fillH:1.05});
document.fonts.load('80px "'+W[1]+'"',W[0]).then(()=>{fitBubbles();window.__ready=true});
</script></body></html>
