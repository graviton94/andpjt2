<!doctype html><html><head><meta charset="utf-8">
<!-- Store screenshot 1080x1920: the real game capture full-bleed (tools/brand/shots/<lang>/*.png from capture-shots.js),
     headline overlaid on a scrim at the top. Light and dark alternate. node tools/brand/render-shots.js -->
<link rel="stylesheet" href="fonts/pretendard/index.css">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:'Pretendard',sans-serif;background:#000;
 --ink:#FFFFFF;--sub:rgba(255,255,255,.86);--scrim:11,7,16;--acc:#FFD23F}
body.light{--ink:#15101C;--sub:rgba(21,16,28,.78);--scrim:255,255,255}
.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.scrim{position:absolute;left:0;right:0;top:0;height:960px;background:linear-gradient(rgba(var(--scrim),.97) 0%,rgba(var(--scrim),.95) 60%,rgba(var(--scrim),.55) 78%,rgba(var(--scrim),0) 100%)}
.cap{position:absolute;left:72px;right:72px;top:104px}
.brand{display:inline-flex;align-items:center;gap:14px;font:800 30px/1 'Pretendard';letter-spacing:.08em;text-transform:uppercase;color:var(--ink);opacity:.9}
.brand i{width:16px;height:16px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 30%,transparent)}
.t{margin-top:34px;font:900 132px/1.02 'Pretendard';letter-spacing:-.035em;color:var(--ink);word-break:keep-all}
body.ko .t{font-size:138px;letter-spacing:-.045em;line-height:1.06}
.t em{font-style:normal;display:inline-block;background:var(--acc);color:#15101C;padding:0 .16em .04em;border-radius:22px;transform:rotate(-2.2deg);box-shadow:0 12px 0 rgba(0,0,0,.22);margin:.04em 0}
.s{margin-top:40px;font:700 48px/1.32 'Pretendard';letter-spacing:-.01em;color:var(--sub);word-break:keep-all}
</style></head><body>
<img class="shot" id="img" alt="">
<div class="scrim"></div>
<div class="cap"><div class="brand"><i></i><span id="b"></span></div><div class="t" id="t"></div><div class="s" id="s"></div></div>
<script>
window.__ready = false;
const q = new URLSearchParams(location.search), L = q.get('lang') || 'en', k = q.get('k');
// *word* = the highlighted word
const S = {
  chain:  { th: 'dark', acc: '#FFD23F', en: ['Swipe, merge,<br>*POP!*', 'Same apps touch — chain the combo'], ko: ['밀면 붙고<br>*팡!* 터진다', '같은 앱이 닿는 순간 연쇄 콤보'] },
  upgrade:{ th: 'light', acc: '#5CE1E6', en: ['Upgrade to<br>*infinity*', 'Milestones unlock gold and holo tiers'], ko: ['강화는<br>*끝이 없다*', '마일스톤마다 금빛 · 홀로 등급'] },
  show:   { th: 'dark', acc: '#FF8A1F', en: ['Watch numbers<br>*explode*', 'Overload waves multiply every payout'], ko: ['숫자가<br>*폭발한다*', '과부하 파동이 합계를 몇 배로'] },
  detail: { th: 'light', acc: '#FF6FB1', en: ['Collect *60*<br>parody apps', 'Every app has its own perk'], ko: ['패러디 앱<br>*60종* 수집', '앱마다 다른 고유 효과'] },
  shade:  { th: 'dark', acc: '#B6F25A', en: ['Pull down for<br>*everything*', 'Shop · upgrades · prestige · time attack'], ko: ['당기면<br>*다 있다*', '상점 · 강화 · 환생 · 60초 타임어택'] },
  attend: { th: 'light', acc: '#FFD23F', en: ['Come back,<br>*grow bigger*', '30-day streak rewards'], ko: ['매일 들르면<br>*더 커진다*', '30일 연속 출석 보상'] },
}[k];
document.body.classList.add(L, S.th); document.body.style.setProperty('--acc', S.acc);
document.getElementById('b').textContent = L === 'ko' ? '방해 금지!' : 'Do Not Disturb!';
document.getElementById('t').innerHTML = S[L][0].replace(/\*([^*]+)\*/g, '<em>$1</em>');
document.getElementById('s').textContent = S[L][1];
const img = document.getElementById('img'); img.onload = () => { window.__ready = true; }; img.src = 'shots/' + L + '/' + k + '.png';
</script></body></html>
