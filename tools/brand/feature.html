<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/black-han-sans/index.css"><link rel="stylesheet" href="fonts/luckiest-guy/index.css"><link rel="stylesheet" href="fonts/dela-gothic-one/index.css">
<style>
*{margin:0;box-sizing:border-box}
body{width:1024px;height:500px;overflow:hidden;position:relative;font-family:var(--f);--f:'Black Han Sans';
 background:radial-gradient(circle at 74% 44%,#ffc45a 0,#ff7a1a 16%,#c2410c 40%,#4a1a08 74%,#1e0c05 100%)}
body.en{--f:'Luckiest Guy'} body.ja{--f:'Dela Gothic One'}
.rays{position:absolute;inset:-400px;background:repeating-conic-gradient(from 0deg at 74% 44%,#ffffff1c 0 6deg,transparent 6deg 15deg)}
.ink{-webkit-text-stroke:var(--s,10px) #2a0c02;paint-order:stroke fill;text-shadow:0 var(--d,8px) 0 #2a0c02;white-space:nowrap}
/* phone */
.phone{position:absolute;left:640px;top:-40px;width:330px;height:600px;border-radius:52px;background:#120a06;border:12px solid #050302;
 box-shadow:-14px 18px 0 #2a0c02aa;transform:rotate(9deg);overflow:hidden}
.screen{position:absolute;inset:0;background:linear-gradient(#2c1d14,#140c08);padding:58px 14px 0}
.sb{position:absolute;top:18px;left:28px;right:28px;display:flex;justify-content:space-between;color:#d9c9b8;font:600 15px system-ui}
.island{position:absolute;top:14px;left:50%;width:90px;height:26px;margin-left:-45px;border-radius:14px;background:#000}
.card{height:64px;border-radius:18px;background:#fff2;border:1px solid #fff3;margin-bottom:9px;display:flex;align-items:center;gap:10px;padding:0 12px;font-family:system-ui,'Noto Sans CJK KR',sans-serif;position:relative}
.card i{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;font:20px var(--f);color:#fff;font-style:normal}
.card b{display:block;font-size:15px;color:#f6efe6}.card span{font-size:12px;color:#c3b2a2}
.card.hot{background:#fff;border-color:#fff;transform:translateX(26px) rotate(-4deg)}
.card.hot b{color:#3a2618}.card.hot span{color:#7b6656}
/* flying cards outside the phone */
.fly{position:absolute;width:210px;height:62px;border-radius:18px;background:#f8efe2;box-shadow:0 7px 0 #0005;display:flex;align-items:center;gap:10px;padding:0 12px;font-family:system-ui,'Noto Sans CJK KR',sans-serif}
.fly i{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;font:19px var(--f);color:#fff;font-style:normal}
.fly b{display:block;font-size:15px;color:#3a2618}.fly span{font-size:12px;color:#7b6656}
.fly em{position:absolute;right:-12px;top:-14px;background:#ff2d2d;color:#fff;font:19px/1 'Luckiest Guy';font-style:normal;padding:7px 9px 3px;border-radius:20px;border:3px solid #fff}
.boom{position:absolute;clip-path:polygon(50% 0,58% 28%,80% 6%,72% 36%,100% 26%,82% 50%,100% 72%,70% 66%,82% 96%,56% 74%,46% 100%,40% 72%,14% 92%,26% 62%,0 58%,24% 44%,6% 18%,34% 30%)}
.shard{position:absolute;background:#f8efe2;box-shadow:0 5px 0 #0004;clip-path:polygon(0 0,100% 25%,65% 100%,8% 70%)}
.spark{position:absolute;background:#fff6c8;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.title{position:absolute;left:30px;top:26px;transform:rotate(-6deg)}
.title .w{display:inline-block;font-size:var(--ts,96px);line-height:1.02;color:#ffe14a}
/* three verb stickers */
.tag{position:absolute;padding:14px 22px 10px;border:5px solid #2a0c02;border-radius:16px;box-shadow:6px 8px 0 #2a0c02;font-size:var(--gs,44px);line-height:1;color:#2a0c02;white-space:nowrap}
.glove{position:absolute;width:118px;filter:drop-shadow(4px 6px 0 #2a0c02)}
.trail{position:absolute;height:12px;border-radius:6px;background:#fff6d8;box-shadow:0 3px 0 #2a0c0255}
.arrow{position:absolute;font:900 54px/1 system-ui;color:#fff6d8;-webkit-text-stroke:6px #2a0c02;paint-order:stroke fill}
</style></head><body>
<div class="rays"></div>
<div class="phone"><div class="screen"><div class="island"></div><div class="sb"><span>9:41</span><span>▂▄▆ 100%</span></div><div id="list"></div></div></div>
<div id="fx"></div>
<div class="title ink" id="title" style="--s:14px;--d:10px"></div>
<div id="tags"></div>
<script>
const L=new URLSearchParams(location.search).get('lang')||'ko';
document.body.classList.add(L);
const T={
 ko:{title:['알림','청소부'],ts:'104px',verbs:['밀고!','합치고!','터뜨려라!'],gs:'46px',pang:'팡!',kwang:'쾅!!',chain:'9연쇄!',pf:'150px',
   list:[['톡','새 메시지 3개','#F5C400','톡'],['메일','새 메일 12개','#2F7BF5','M'],['쇼핑','배송 출발','#FF5A36','쇼'],['뱅킹','입금 알림','#1BA784','₩'],['영상','새 동영상','#E0262B','▶'],['날씨','비 소식','#3AA0FF','☂']],
   fly:[['스팸','당첨되셨습니다?!','#FF3B30','!','99+'],['톡','ㅋㅋㅋㅋㅋ','#F5C400','톡','12'],['메일','광고) 오늘만 특가','#2F7BF5','M','5']]},
 en:{title:['NOTIFICATION','SWEEPER'],ts:'72px',verbs:['SWIPE!','MERGE!','POP IT!'],gs:'40px',pang:'POP!',kwang:'BOOM!!',chain:'9 CHAIN!',pf:'118px',
   list:[['Chat','3 new messages','#F5C400','C'],['Mail','12 new emails','#2F7BF5','M'],['Shop','Out for delivery','#FF5A36','S'],['Bank','Deposit received','#1BA784','$'],['Video','New upload','#E0262B','▶'],['Weather','Rain later','#3AA0FF','☂']],
   fly:[['Spam','You WON?!','#FF3B30','!','99+'],['Chat','lololol','#F5C400','C','12'],['Mail','Today only: 90% off','#2F7BF5','M','5']]},
 ja:{title:['通知','おそうじ'],ts:'92px',verbs:['スワイプ!','合体!','はじけろ!'],gs:'36px',pang:'パン!',kwang:'ドカン!!',chain:'9連鎖!',pf:'100px',
   list:[['チャット','新着メッセージ3件','#F5C400','C'],['メール','新着メール12件','#2F7BF5','M'],['ショップ','発送しました','#FF5A36','S'],['バンク','入金のお知らせ','#1BA784','¥'],['動画','新着動画','#E0262B','▶'],['天気','雨のお知らせ','#3AA0FF','☂']],
   fly:[['迷惑','当選しました?!','#FF3B30','!','99+'],['チャット','www','#F5C400','C','12'],['メール','本日限定セール','#2F7BF5','M','5']]}}[L];
document.body.style.setProperty('--ts',T.ts);document.body.style.setProperty('--gs',T.gs);
title.innerHTML=T.title.map((w,li)=>'<div>'+[...w].map((ch,i)=>`<span class="w" style="transform:translateY(${[0,-9,6,-6,8,-4][i%6]}px) rotate(${[-6,5,-3,7,-5,4][(i+li)%6]}deg)">${ch}</span>`).join('')+'</div>').join('');
list.innerHTML=T.list.map((c,i)=>`<div class="card ${i===2?'hot':''}"><i style="background:${c[2]}">${c[3]}</i><div><b>${c[0]}</b><span>${c[1]}</span></div></div>`).join('');
// blast centred on the "hot" card inside the phone, spilling out over the frame
const cx=770, cy=250;
const boom=(w,c,r)=>`<div class="boom" style="left:${cx-w/2}px;top:${cy-w/2}px;width:${w}px;height:${w}px;background:${c};transform:rotate(${r}deg)"></div>`;
fx.innerHTML=boom(380,'#2a0c02',12)+boom(360,'#ffe14a',12)+boom(270,'#fff',12)
 +`<div class="ink" style="position:absolute;left:${cx-150}px;top:${cy-80}px;width:300px;text-align:center;font-size:${T.pf};line-height:1;color:#ff3b30;transform:rotate(-10deg);--s:12px">${T.pang}</div>`
 +T.fly.map((c,i)=>{const[x,y,r]=[[560,40,-16],[860,380,12],[540,330,-8]][i];return `<div class="fly" style="left:${x}px;top:${y}px;transform:rotate(${r}deg)"><i style="background:${c[2]}">${c[3]}</i><div><b>${c[0]}</b><span>${c[1]}</span></div><em>${c[4]}</em></div>`}).join('')
 +[[640,150,22,38],[900,210,-30,34],[700,420,50,26],[930,90,10,24],[600,250,-40,22],[860,40,30,18]].map(([x,y,r,s])=>`<div class="shard" style="left:${x}px;top:${y}px;width:${s}px;height:${s*.8}px;transform:rotate(${r}deg)"></div>`).join('')
 +`<div class="ink" style="position:absolute;left:880px;top:300px;font-size:${L==='ko'?50:40}px;color:#ffe14a;transform:rotate(16deg);--s:9px;--d:6px">${T.kwang}</div>`
 +`<div class="ink" style="position:absolute;left:868px;top:92px;font:46px 'Luckiest Guy';color:#fff;transform:rotate(8deg);--s:8px;--d:6px">+1.2M</div>`
 +`<div class="ink" style="position:absolute;left:600px;top:400px;font-size:${L==='ko'?40:32}px;color:#fff;transform:rotate(-6deg);--s:8px;--d:6px">${T.chain}</div>`
 +`<div class="ink" style="position:absolute;left:910px;top:440px;font:40px 'Luckiest Guy';color:#ffe14a;transform:rotate(-14deg);--s:8px;--d:6px">×9</div>`
 +[[520,26,38],[980,250,40],[500,460,26],[700,30,22]].map(([x,y,s])=>`<div class="spark" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px"></div>`).join('');
// verbs: three separate stickers; "push" gets the glove dragging it with a swipe trail
tags.innerHTML=
 `<div class="trail" style="left:14px;top:300px;width:84px;transform:rotate(-4deg)"></div><div class="trail" style="left:4px;top:322px;width:56px;transform:rotate(-4deg);opacity:.7"></div>`
 +`<div class="tag ink" id="push" style="left:196px;top:270px;background:#fff;color:#2a0c02;transform:rotate(-5deg);--s:0px;--d:0px;text-shadow:none">${T.verbs[0]}</div>`
 +`<img class="glove" src="../../docs/design/ui-assets/tutorial/hand-press.png" style="left:96px;top:226px;transform:rotate(-30deg)">`
 +`<div class="arrow" id="arr" style="top:278px;transform:rotate(-6deg)">➜</div>`
 +`<div class="tag" style="left:${L==='ja'?120:110}px;top:372px;background:#7ee0ff;transform:rotate(4deg)">${T.verbs[1]}</div>`
 +`<div class="tag ink" style="left:${L==='en'?300:300}px;top:384px;background:#ff3b30;color:#ffe14a;transform:rotate(-7deg) scale(1.12);--s:6px;--d:0px">${T.verbs[2]}</div>`;
const pr=push.getBoundingClientRect();arr.style.left=(pr.right+12)+"px";
</script></body></html>
