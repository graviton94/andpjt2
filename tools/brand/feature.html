<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/black-han-sans/index.css"><link rel="stylesheet" href="fonts/luckiest-guy/index.css">
<style>
*{margin:0;box-sizing:border-box}
body{width:1024px;height:500px;overflow:hidden;position:relative;font-family:'Black Han Sans','Luckiest Guy',sans-serif;
 background:radial-gradient(circle at 70% 46%,#ffc45a 0,#ff7a1a 18%,#c2410c 42%,#4a1a08 75%,#1e0c05 100%)}
.en{font-family:'Luckiest Guy','Black Han Sans',sans-serif}
.rays{position:absolute;inset:-400px;background:repeating-conic-gradient(from 0deg at 70% 46%,#ffffff1a 0 6deg,transparent 6deg 15deg)}
.crack{position:absolute;inset:0}
.card{position:absolute;width:250px;height:70px;border-radius:22px;background:#f8efe2;box-shadow:0 8px 0 #0005;display:flex;align-items:center;gap:12px;padding:0 14px;font-family:system-ui,'Noto Sans CJK KR',sans-serif}
.card i{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;font:22px 'Black Han Sans','Luckiest Guy';color:#fff;font-style:normal}
.card b{display:block;font-size:17px;color:#3a2618}.card span{font-size:13px;color:#7b6656}
.card em{position:absolute;right:-12px;top:-14px;background:#ff2d2d;color:#fff;font:20px/1 'Luckiest Guy';font-style:normal;padding:7px 9px 3px;border-radius:20px;border:3px solid #fff}
.title{position:absolute;left:34px;top:64px;width:520px;transform:rotate(-6deg)}
.title .w{display:inline-block;font-size:104px;line-height:1;color:#ffe14a;-webkit-text-stroke:14px #2a0c02;paint-order:stroke fill;text-shadow:0 10px 0 #2a0c02}
.en .title .w{font-size:80px;-webkit-text-stroke:12px #2a0c02}
.ribbon{position:absolute;left:58px;top:330px;transform:rotate(-4deg);background:#fff;color:#2a0c02;padding:14px 24px 10px;font-size:34px;border-radius:12px;box-shadow:6px 8px 0 #2a0c02;border:4px solid #2a0c02}
.ribbon b{color:#ff3b30;font-weight:400}
.boom{position:absolute;display:grid;place-items:center;
 clip-path:polygon(50% 0,58% 28%,80% 6%,72% 36%,100% 26%,82% 50%,100% 72%,70% 66%,82% 96%,56% 74%,46% 100%,40% 72%,14% 92%,26% 62%,0 58%,24% 44%,6% 18%,34% 30%)}
.word{position:absolute;color:#ff3b30;-webkit-text-stroke:9px #2a0c02;paint-order:stroke fill;text-shadow:0 7px 0 #2a0c02;white-space:nowrap}
.num{position:absolute;color:#fff;-webkit-text-stroke:8px #2a0c02;paint-order:stroke fill;text-shadow:0 6px 0 #2a0c02;font-family:'Luckiest Guy';white-space:nowrap}
.shard{position:absolute;background:#f8efe2;box-shadow:0 5px 0 #0004}
.spark{position:absolute;background:#fff6c8;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.streak{position:absolute;height:10px;border-radius:5px;background:#fff6d8}
</style></head><body>
<div class="rays"></div>
<svg class="crack" viewBox="0 0 1024 500"><g fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round">
<path d="M716 230 L640 150 L600 40 M716 230 L820 120 L870 20 M716 230 L900 260 L1024 240 M716 230 L760 380 L740 500 M716 230 L600 330 L560 420"/>
<path d="M660 170 L700 140 L760 160 L820 120 M610 300 L660 280 L760 300 L820 320 L900 260" stroke-opacity=".35"/></g></svg>
<div id="cards"></div>
<div class="boom" style="left:600px;top:110px;width:250px;height:250px;background:#ffe14a;transform:rotate(10deg)"></div>
<div class="boom" style="left:625px;top:135px;width:200px;height:200px;background:#fff;transform:rotate(10deg)"></div>
<div id="words"></div>
<div class="title" id="title"></div>
<div class="ribbon" id="ribbon"></div>
<div class="spark" style="left:560px;top:40px;width:40px;height:40px"></div>
<div class="spark" style="left:960px;top:400px;width:46px;height:46px"></div>
<div class="spark" style="left:520px;top:440px;width:28px;height:28px"></div>
<div class="spark" style="left:880px;top:200px;width:26px;height:26px"></div>
<script>
const L=new URLSearchParams(location.search).get('lang')||'ko';
if(L==='en')document.body.classList.add('en');
const T={
 ko:{title:['알림','청소부'],rib:'밀고! 합치고! <b>터뜨려라!</b>',pang:'팡!',kwang:'쾅!!',chain:'9연쇄!',
   cards:[['톡','새 메시지 3개','#F5C400','톡'],['메일','새 메일 12개','#2F7BF5','M'],['쇼핑','배송 알림','#FF5A36','쇼'],['스팸','당첨되셨습니다?!','#FF3B30','!'],['뱅킹','입금 알림','#1BA784','₩']]},
 en:{title:['NOTIFICATION','SWEEPER'],rib:'SWIPE! MERGE! <b>POP IT ALL!</b>',pang:'POP!',kwang:'BOOM!!',chain:'9 CHAIN!',
   cards:[['Chat','3 new messages','#F5C400','C'],['Mail','12 new emails','#2F7BF5','M'],['Shop','Delivery update','#FF5A36','S'],['Spam','You WON?!','#FF3B30','!'],['Bank','Deposit received','#1BA784','$']]}}[L];
// title: each syllable hops at its own angle
title.innerHTML=T.title.map((w,li)=>'<div>'+[...w].map((ch,i)=>`<span class="w" style="transform:translateY(${[0,-10,6,-6,8,-4][i%6]}px) rotate(${[-6,5,-3,7,-5,4][(i+li)%6]}deg)">${ch}</span>`).join('')+'</div>').join('');
ribbon.innerHTML=T.rib;
// cards flung around the blast, each tilted, some cut by the edge
const pos=[[560,10,-18,'99+'],[820,40,14,'12'],[880,330,-10,'5'],[600,380,8,'99+'],[430,250,-24,'3']];
cards.innerHTML=T.cards.map((c,i)=>{const[x,y,r,n]=pos[i];return `<div class="card" style="left:${x}px;top:${y}px;transform:rotate(${r}deg)"><i style="background:${c[2]}">${c[3]}</i><div><b>${c[0]}</b><span>${c[1]}</span></div><em>${n}</em></div>`}).join('')
 +[[760,100,22,40],[840,250,-30,32],[700,330,50,26],[880,160,10,22],[640,90,-40,20]].map(([x,y,r,s])=>`<div class="shard" style="left:${x}px;top:${y}px;width:${s}px;height:${s*.8}px;transform:rotate(${r}deg);clip-path:polygon(0 0,100% 25%,65% 100%,8% 70%)"></div>`).join('')
 +[[470,180,90],[450,215,60],[480,245,110]].map(([x,y,w])=>`<div class="streak" style="left:${x}px;top:${y}px;width:${w}px;transform:rotate(-8deg)"></div>`).join('');
words.innerHTML=
 `<div class="word" style="left:650px;top:178px;font-size:${L==='en'?74:96}px;transform:rotate(-12deg)">${T.pang}</div>`+
 `<div class="word" style="left:860px;top:110px;font-size:${L==='en'?44:56}px;color:#ffe14a;transform:rotate(16deg)">${T.kwang}</div>`+
 `<div class="word" style="left:560px;top:300px;font-size:44px;color:#fff;transform:rotate(-6deg)">${T.chain}</div>`+
 `<div class="num" style="left:820px;top:240px;font-size:54px;transform:rotate(8deg)">+1.2M</div>`+
 `<div class="num" style="left:900px;top:20px;font-size:30px;transform:rotate(-10deg)">+48K</div>`+
 `<div class="num" style="left:780px;top:420px;font-size:40px;color:#ffe14a;transform:rotate(-14deg)">×9</div>`;
</script></body></html>
