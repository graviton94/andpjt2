<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/black-han-sans/index.css"><link rel="stylesheet" href="fonts/luckiest-guy/index.css"><link rel="stylesheet" href="fonts/dela-gothic-one/index.css"><link rel="stylesheet" href="fonts/noto-sans-tc/index.css">
<style>
*{margin:0;box-sizing:border-box}
body{width:1024px;height:500px;overflow:hidden;position:relative;font-family:var(--f);--f:'Black Han Sans';
 background:radial-gradient(circle at 74% 44%,#ffc45a 0,#ff7a1a 16%,#c2410c 40%,#4a1a08 74%,#1e0c05 100%)}
body.en,body.es{--f:'Luckiest Guy'} body.ja{--f:'Dela Gothic One'} body.zh-TW{--f:'Noto Sans TC'} body.zh-TW .title,body.zh-TW .tag,body.zh-TW .ink{font-weight:900} body.ja .title>div{transform:scaleX(.84)} body.ja .tag{letter-spacing:-2px}
.rays{position:absolute;inset:-400px;background:repeating-conic-gradient(from 0deg at 74% 44%,#ffffff1c 0 6deg,transparent 6deg 15deg)}
.ink{-webkit-text-stroke:var(--s,10px) #2a0c02;paint-order:stroke fill;text-shadow:0 var(--d,8px) 0 #2a0c02;white-space:nowrap}
/* phone */
.phone{position:absolute;left:640px;top:8px;width:330px;height:600px;border-radius:52px;background:#120a06;border:12px solid #050302;
 box-shadow:-14px 18px 0 #2a0c02aa;transform:rotate(9deg);overflow:hidden}
.screen{position:absolute;inset:0;background:linear-gradient(#2c1d14,#140c08);padding:58px 14px 0}
.sb{position:absolute;top:17px;left:30px;right:26px;height:24px;display:flex;justify-content:space-between;align-items:center;color:#f3e8dc;font:700 16px system-ui,sans-serif;letter-spacing:.2px}.sb .r{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:14px;left:50%;width:90px;height:26px;margin-left:-45px;border-radius:14px;background:#000}
.card{height:64px;border-radius:18px;background:#fff2;border:1px solid #fff3;margin-bottom:9px;display:flex;align-items:center;gap:10px;padding:0 12px;font-family:system-ui,'Noto Sans CJK KR',sans-serif;position:relative}
.card i{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;font:20px var(--f);color:#fff;font-style:normal}
.card b{display:block;font-size:15px;color:#f6efe6}.card span{font-size:12px;color:#c3b2a2}
.card.hot{background:#fff;border-color:#fff;transform:translateX(26px) rotate(-4deg)}
.card.hot b{color:#3a2618}.card.hot span{color:#7b6656}
/* flying cards outside the phone */
.fly{position:absolute;width:210px;height:62px;border-radius:18px;background:#f8efe2;box-shadow:0 7px 0 #0005;display:flex;align-items:center;gap:10px;padding:0 12px;font-family:system-ui,'Noto Sans CJK KR',sans-serif}
.fly i{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;font:19px var(--f);color:#fff;font-style:normal}
.fly b{display:block;font-size:15px;color:#3a2618}.fly span{font-size:12px;color:#7b6656}
.fly em{position:absolute;right:-12px;top:-14px;background:#ff2d2d;color:#fff;font:19px/1 'Luckiest Guy';font-style:normal;padding:7px 9px 3px;border-radius:20px;border:3px solid #fff}
.boom{position:absolute;clip-path:polygon(50% 0,58% 28%,80% 6%,72% 36%,100% 26%,82% 50%,100% 72%,70% 66%,82% 96%,56% 74%,46% 100%,40% 72%,14% 92%,26% 62%,0 58%,24% 44%,6% 18%,34% 30%)}
.shard{position:absolute;background:#f8efe2;box-shadow:0 5px 0 #0004;clip-path:polygon(0 0,100% 25%,65% 100%,8% 70%)}
.spark{position:absolute;background:#fff6c8;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.title{position:absolute;left:4px;top:34px;width:620px;z-index:6;text-align:center;transform:rotate(-5deg)}
.title .w{display:inline-block;font-size:var(--ts,96px);line-height:.98;color:#ffe14a}
/* three verb stickers */
.tag{position:absolute;padding:14px 22px 10px;border:5px solid #2a0c02;border-radius:16px;box-shadow:6px 8px 0 #2a0c02;font-size:var(--gs,44px);line-height:1;color:#2a0c02;white-space:nowrap}
.glove{position:absolute;width:118px;filter:drop-shadow(4px 6px 0 #2a0c02)}
.trail{position:absolute;height:12px;border-radius:6px;background:#fff6d8;box-shadow:0 3px 0 #2a0c0255}
</style></head><body>
<div class="rays"></div>

<div id="fx"></div>

<script>

 +T.fly.map((c,i)=>{const[x,y,r]=[[520,118,-16],[860,380,12],[540,330,-8]][i];return `<div class="fly" style="left:${x}px;top:${y}px;transform:rotate(${r}deg)"><i style="background:${c[2]}">${c[3]}</i><div><b>${c[0]}</b><span>${c[1]}</span></div><em>${c[4]}</em></div>`}).join('')

const Y0=246, X0=176;

 `<img src="../../docs/design/ui-assets/comic-fx/swipe-trail.png" style="position:absolute;left:${X0-250}px;top:${Y0+100}px;width:200px;transform:rotate(-38deg)">`

Promise.all([document.fonts.load(WT+' 80px "'+FAM+'"',T.pang+T.kwang),document.fonts.load('80px "Luckiest Guy"','+1.2M')]).then(()=>document.fonts.ready).then(()=>{fitBubbles();
